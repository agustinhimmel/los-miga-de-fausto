<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Panel · Los Miga de Fausto</title>
<meta name="theme-color" content="#d5202c">
<link rel="icon" type="image/png" href="../img/fausto.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --pan:#fbf8f6; --papel:#ffffff; --tinta:#2b1416; --tinta2:#6d5557; --linea:#ebe0de;
  --rojo:#d5202c; --rojo-suave:#fde9e9; --verde:#1f6b4f; --verde-suave:#e2f3ea; --wa:#128c4a;
  --ambar:#8a5a00; --ambar-suave:#fff1cf; --azul:#1d5fa8; --azul-suave:#e3effb;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --texto:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --pan:#120a0b; --papel:#1c1012; --tinta:#f8f0ef; --tinta2:#b9a3a4; --linea:#38262a;
  --rojo:#ff5a63; --rojo-suave:#3a171b; --verde:#7fd0ac; --verde-suave:#16302a; --wa:#2fbf71;
  --ambar:#f2c230; --ambar-suave:#3a2e10; --azul:#8fc0f5; --azul-suave:#14283d; color-scheme:dark } }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pan);color:var(--tinta);font:16px/1.45 var(--texto)}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.marco{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.cab{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.cab img{width:40px;height:40px;border-radius:50%}
.cab h1{font-size:20px;flex:1}
.cab button{background:none;border:1px solid var(--linea);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--tinta2);cursor:pointer}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:16px;margin-bottom:12px}
.tarjeta h2{font-size:18px;margin-bottom:10px}
.chica{font-size:13px;color:var(--tinta2);margin:0}
.campo{display:grid;gap:6px;margin-bottom:12px}
.campo label{font-size:13px;font-weight:600}
.campo input{border:1px solid var(--linea);background:var(--pan);border-radius:12px;padding:12px;width:100%}
.boton{display:block;width:100%;border:0;border-radius:12px;padding:13px 14px;background:var(--rojo);color:#fff;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
@media (prefers-color-scheme: dark){.boton{color:#1a0406}}
.boton:disabled{opacity:.55}
.boton.suave{background:var(--pan);color:var(--tinta);border:1px solid var(--linea)}
.boton.wa{background:var(--wa);color:#fff}
.error{color:var(--rojo);font-size:14px;font-weight:600;margin:0 0 10px}
.numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.numeros div{background:var(--pan);border-radius:12px;padding:10px}
.numeros b{display:block;font-family:var(--display);font-size:20px;line-height:1.1;overflow-wrap:anywhere}
.numeros span{font-size:12px;color:var(--tinta2)}
.aviso{display:flex;align-items:center;gap:12px;background:var(--ambar-suave);color:var(--ambar);border-radius:14px;padding:14px;margin-bottom:12px;border:0;width:100%;text-align:left;cursor:pointer;font-weight:700}
.aviso b{font-family:var(--display);font-size:26px}
.dia-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dia-cab small{color:var(--tinta2);font-size:13px}
.medidor{height:8px;background:var(--pan);border-radius:99px;overflow:hidden;margin:8px 0 12px}
.medidor i{display:block;height:100%;background:var(--rojo);border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 0;border-top:1px solid var(--linea);text-align:left}
td:last-child,th:last-child{text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--tinta2);font-weight:600;border-top:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 10px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--linea);background:var(--papel);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--tinta);color:var(--pan);border-color:var(--tinta)}
.pedido.apagado{opacity:.6}
.pedido-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pedido-cab h3{font-size:18px}
.pedido-cab small{font:500 13px var(--texto);color:var(--tinta2)}
.estado{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.e-nuevo{background:var(--ambar-suave);color:var(--ambar)}
.e-confirmado,.e-en_preparacion{background:var(--azul-suave);color:var(--azul)}
.e-en_camino{background:var(--rojo-suave);color:var(--rojo)}
.e-entregado{background:var(--verde-suave);color:var(--verde)}
.e-cancelado{background:var(--pan);color:var(--tinta2);text-decoration:line-through}
.datos{font-size:14px;margin:0 0 8px;display:grid;gap:3px}
.datos a{color:inherit}
.nota-cli{background:var(--ambar-suave);color:var(--ambar);border-radius:10px;padding:8px 10px;font-size:14px;margin:0 0 8px}
.lista{list-style:none;margin:0 0 8px;padding:0;font-size:14px}
.lista li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.total{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--linea);padding-top:8px;margin-bottom:12px}
.acciones{display:grid;gap:8px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cobro{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:10px 12px;border:1px solid var(--linea);border-radius:12px;cursor:pointer;justify-content:center}
.cobro input{width:18px;height:18px;accent-color:var(--verde)}
.cobro.si{background:var(--verde-suave);color:var(--verde);border-color:transparent}
details summary{font-size:13px;color:var(--tinta2);cursor:pointer;padding:4px 0}
details .dos{margin-top:8px}
.gps{background:var(--rojo-suave);color:var(--rojo);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:1px solid var(--linea);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav div{display:flex;width:100%;max-width:760px}
.nav button{flex:1;background:none;border:0;padding:10px 2px 12px;font-size:12px;font-weight:600;color:var(--tinta2);cursor:pointer;display:grid;gap:2px;justify-items:center;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--rojo)}
.nav .globo{position:absolute;top:4px;left:calc(50% + 6px);background:var(--rojo);color:#fff;border-radius:99px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}
.vacio{text-align:center;color:var(--tinta2);padding:28px 8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="marco">
  <header class="cab">
    <img src="../img/fausto.png" alt="">
    <h1>Panel de la miga</h1>
    <button type="button" id="salir" hidden>Salir</button>
  </header>

  <form class="tarjeta" id="entrada" hidden novalidate>
    <h2 id="entrada-t">Entrar</h2>
    <div class="campo" id="campo-nombre" hidden><label for="nombre">Tu nombre</label><input id="nombre" autocomplete="name"></div>
    <div class="campo"><label for="mail">Mail</label><input id="mail" type="email" autocomplete="username" inputmode="email"></div>
    <div class="campo"><label for="clave">Contraseña</label><input id="clave" type="password" autocomplete="current-password"></div>
    <p class="error" id="entrada-error" hidden></p>
    <p class="chica" id="entrada-ok" style="margin-bottom:10px" hidden></p>
    <button class="boton" type="submit" id="entrada-b">Entrar</button>
    <button class="boton suave" type="button" id="modo" style="margin-top:8px">Es mi primera vez: crear mi cuenta</button>
  </form>

  <div class="tarjeta" id="sin-permiso" hidden>
    <h2>Tu cuenta ya está creada</h2>
    <p class="chica">Falta que Agustín la habilite. Avisale, y cuando te diga que está, volvé a entrar.</p>
  </div>

  <main id="adentro" hidden>
    <div class="gps" id="gps" hidden></div>
    <p class="error" id="falla" hidden></p>
    <section id="v-inicio"></section>
    <section id="v-pedidos" hidden>
      <div class="chips" id="filtro"></div>
      <div id="lista-pedidos"></div>
    </section>
    <section id="v-pronto" hidden>
      <div class="tarjeta"><h2 id="pronto-t"></h2><p class="chica" id="pronto-d"></p></div>
    </section>
  </main>
</div>

<nav class="nav" id="nav" hidden><div>
  <button type="button" data-ir="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Inicio</button>
  <button type="button" data-ir="pedidos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Pedidos<span class="globo" id="globo" hidden></span></button>
  <button type="button" data-ir="recetas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM9 9h6M9 13h4"/></svg>Recetas</button>
  <button type="button" data-ir="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg>Stock</button>
  <button type="button" data-ir="numeros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Números</button>
</div></nav>

<script>
(function(){
  var BASE={url:"https://ikptgfyfqvgrhhemvzly.supabase.co",clave:"sb_publishable_Mk65UgFQ0zPuubaz0SMXpg_IJTNdh16"};
  var $=function(id){return document.getElementById(id)};
  var plata=function(n){return "$"+Math.round(n).toLocaleString("es-AR")};
  function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  var DC=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  function fechaCorta(f){var a=f.split("-"),d=new Date(+a[0],a[1]-1,+a[2]);return DC[d.getDay()]+" "+(+a[2])+"/"+(+a[1])}
  function hoy(){return new Date().toLocaleDateString("en-CA",{timeZone:"America/Argentina/Buenos_Aires"})}
  function masDias(f,n){var a=f.split("-"),d=new Date(Date.UTC(+a[0],a[1]-1,+a[2]+n));return d.toISOString().slice(0,10)}

  /* ---------- sesión ---------- */
  var S=null;
  try{S=JSON.parse(localStorage.getItem("miga-panel")||"null")}catch(e){}
  function guardar(j){S=j?{a:j.access_token,r:j.refresh_token,v:Date.now()+(j.expires_in||3600)*1000,m:j.user&&j.user.email}:null;
    try{if(S)localStorage.setItem("miga-panel",JSON.stringify(S));else localStorage.removeItem("miga-panel")}catch(e){}}
  function ficha(tipo,cuerpo){
    return fetch(BASE.url+"/auth/v1/token?grant_type="+tipo,{method:"POST",headers:{apikey:BASE.clave,"Content-Type":"application/json"},body:JSON.stringify(cuerpo)})
      .then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error("no");e.estado=r.status;throw e}guardar(j);return j})})}
  var renovando=null;
  function renovar(){if(!renovando)renovando=ficha("refresh_token",{refresh_token:S.r}).then(function(x){renovando=null;return x},function(e){renovando=null;if(e.estado)afuera();throw e});return renovando}
  function llamar(camino,opt){opt=opt||{};
    var ir=function(){return fetch(BASE.url+"/rest/v1/"+camino,{method:opt.metodo||(opt.cuerpo?"POST":"GET"),body:opt.cuerpo?JSON.stringify(opt.cuerpo):undefined,
      headers:{apikey:BASE.clave,Authorization:"Bearer "+S.a,"Content-Type":"application/json",Prefer:opt.metodo==="PATCH"?"return=minimal":"return=representation"}})};
    var antes=S.v-Date.now()<60000?renovar():Promise.resolve();
    return antes.then(ir).then(function(r){if(r.status===401)return renovar().then(ir);return r})
      .then(function(r){if(!r.ok)throw new Error("La base contestó "+r.status);return r.status===204||r.status===201?null:r.json()})}

  /* ---------- datos ---------- */
  var pedidos=[],contenido={},productos={},dias={},vista="inicio",filtro="proximos",listo=false;
  var ORDEN={nuevo:0,confirmado:1,en_preparacion:2,en_camino:3,entregado:4,cancelado:5};
  function nombreEstado(p){return {nuevo:"Nuevo",confirmado:"Confirmado",en_preparacion:"En preparación",en_camino:p.entrega==="envio"?"En camino":"Listo para retirar",entregado:"Entregado",cancelado:"Cancelado"}[p.estado]}
  function siguiente(p){return {nuevo:["confirmado","Confirmar pedido"],confirmado:["en_preparacion","Empezar a preparar"],
    en_preparacion:["en_camino",p.entrega==="envio"?"Salgo a entregar":"Ya está listo para retirar"],en_camino:["entregado","Entregado"]}[p.estado]}
  function anterior(p){return {confirmado:"nuevo",en_preparacion:"confirmado",en_camino:"en_preparacion",entregado:"en_camino",cancelado:"nuevo"}[p.estado]}
  function vivo(p){return p.estado!=="cancelado"}

  function traer(){
    var desde=masDias(hoy(),-45);
    return Promise.all([
      llamar("pedidos?select=*,pedido_renglones(*)&fecha_entrega=gte."+desde+"&order=fecha_entrega.asc,numero.asc"),
      llamar("producto_contenido?select=*"),llamar("productos?select=id,nombre,tipo,pestana,orden"),llamar("dias_entrega?select=*")
    ]).then(function(r){
      pedidos=r[0];contenido={};productos={};dias={};
      r[1].forEach(function(c){(contenido[c.producto_id]=contenido[c.producto_id]||[]).push(c)});
      r[2].forEach(function(p){productos[p.id]=p});r[3].forEach(function(d){dias[d.fecha]=d});
      listo=true;$("falla").hidden=true;pintar();reparto();
    }).catch(function(e){if(S){$("falla").hidden=false;$("falla").textContent="No pudimos traer los pedidos. Revisá la conexión."}})}

  /* cuánto hay que hacer de cada gusto, y qué más hay que tener */
  function produccion(lista){var g={},x={};
    lista.forEach(function(p){p.pedido_renglones.forEach(function(r){var pr=productos[r.producto_id]||{};
      if(pr.tipo==="gusto")g[r.producto_id]=(g[r.producto_id]||0)+r.cantidad;
      (contenido[r.producto_id]||[]).forEach(function(c){g[c.gusto_id]=(g[c.gusto_id]||0)+c.cantidad*r.cantidad});
      if(pr.tipo==="extra")x[r.producto_id]=(x[r.producto_id]||0)+r.cantidad})});
    var ord=function(o){return Object.keys(o).sort(function(a,b){return ((productos[a]||{}).orden||0)-((productos[b]||{}).orden||0)}).map(function(id){return {id:id,n:(productos[id]||{}).nombre||id,c:o[id]}})};
    return {gustos:ord(g),extras:ord(x)}}

  /* ---------- inicio ---------- */
  function pintarInicio(){var h="",H=hoy(),nuevos=pedidos.filter(function(p){return p.estado==="nuevo"}).length;
    if(nuevos)h+='<button type="button" class="aviso" data-ir="pedidos"><b>'+nuevos+'</b><span>'+(nuevos===1?"pedido nuevo para confirmar":"pedidos nuevos para confirmar")+'</span></button>';
    var prox={};pedidos.forEach(function(p){if(vivo(p)&&p.fecha_entrega>=H)(prox[p.fecha_entrega]=prox[p.fecha_entrega]||[]).push(p)});
    var fechas=Object.keys(prox).sort();
    if(!fechas.length)h+='<div class="tarjeta"><h2>Próximas entregas</h2><p class="chica">Todavía no hay pedidos para los próximos días.</p></div>';
    fechas.forEach(function(f){var l=prox[f],s=0,t=0;l.forEach(function(p){s+=p.sandwiches;t+=p.total});
      var cupo=(dias[f]||{}).cupo||0,pr=produccion(l);
      h+='<div class="tarjeta"><div class="dia-cab"><h2>'+(f===H?"Hoy · ":"")+fechaCorta(f)+((dias[f]||{}).etiqueta?" · "+esc(dias[f].etiqueta):"")+'</h2><small>'+l.length+(l.length===1?" pedido":" pedidos")+" · "+plata(t)+'</small></div>'+
        '<div class="medidor"><i style="width:'+(cupo?Math.min(100,Math.round(100*s/cupo)):0)+'%"></i></div>'+
        '<p class="chica" style="margin-bottom:10px">'+s+" sándwiches"+(cupo?" de "+cupo+" que podés hacer":"")+'</p>'+
        '<table><tr><th>Para producir</th><th>Sándwiches</th><th>Armadas</th></tr>';
      pr.gustos.forEach(function(g){h+="<tr><td>"+esc(g.n)+"</td><td>"+g.c+"</td><td>"+Math.ceil(g.c/6)+"</td></tr>"});
      h+="</table>";
      if(pr.extras.length){h+='<table style="margin-top:10px"><tr><th>Además hay que tener</th><th>Cantidad</th></tr>';
        pr.extras.forEach(function(g){h+="<tr><td>"+esc(g.n)+"</td><td>"+g.c+"</td></tr>"});h+="</table>"}
      h+='<button type="button" class="boton suave" style="margin-top:12px" data-dia="'+f+'">Ver los pedidos de este día</button></div>'});
    var mes=H.slice(0,7),v=0,c=0,n=0;pedidos.forEach(function(p){if(vivo(p)&&p.fecha_entrega.slice(0,7)===mes){v+=p.total;n++;if(p.cobrado)c+=p.total}});
    h+='<div class="tarjeta"><h2>Este mes</h2><div class="numeros"><div><b>'+plata(v)+'</b><span>vendido en '+n+(n===1?" pedido":" pedidos")+'</span></div><div><b>'+plata(c)+'</b><span>ya cobrado</span></div><div><b>'+plata(v-c)+'</b><span>falta cobrar</span></div></div></div>';
    $("v-inicio").innerHTML=h}

  /* ---------- pedidos ---------- */
  function telWa(t){var d=String(t).replace(/\D/g,"").replace(/^0+/,"");if(d.indexOf("54")===0)return d;if(d.length===10)return "549"+d;return d}
  function enlaceSeguir(p){return new URL("../pedido/?c="+p.id,location.href).href}
  function avisoWa(p){var n=p.nombre.split(" ")[0],m={
      nuevo:"Hola "+n+"! Recibimos tu pedido N° "+p.numero+" de Los Miga de Fausto. Enseguida te lo confirmamos.",
      confirmado:"Hola "+n+"! Tu pedido N° "+p.numero+" quedó confirmado para el "+fechaCorta(p.fecha_entrega)+". Total: "+plata(p.total)+".",
      en_preparacion:"Hola "+n+"! Ya estamos preparando tu pedido N° "+p.numero+".",
      en_camino:p.entrega==="envio"?"Hola "+n+"! Tu pedido N° "+p.numero+" ya está en camino. Podés ver por dónde viene acá:":"Hola "+n+"! Tu pedido N° "+p.numero+" ya está listo para retirar.",
      entregado:"Gracias "+n+"! Que los disfrutes.",cancelado:"Hola "+n+", tu pedido N° "+p.numero+" quedó cancelado."}[p.estado];
    if(p.estado!=="entregado"&&p.estado!=="cancelado")m+=(p.estado==="en_camino"&&p.entrega==="envio"?"\n":"\nSeguilo acá: ")+enlaceSeguir(p);
    return "https://wa.me/"+telWa(p.telefono)+"?text="+encodeURIComponent(m)}
  function tarjeta(p){var s=siguiente(p),a=anterior(p),h="";
    h+='<div class="tarjeta pedido'+(p.estado==="entregado"||p.estado==="cancelado"?" apagado":"")+'">'+
      '<div class="pedido-cab"><h3>N° '+p.numero+' · '+esc(p.nombre)+'<br><small>'+fechaCorta(p.fecha_entrega)+" · "+(p.entrega==="envio"?"Envío":"Retira")+" · "+(p.pago==="efectivo"?"Efectivo":"Transferencia")+'</small></h3>'+
      '<span class="estado e-'+p.estado+'">'+nombreEstado(p)+'</span></div><p class="datos">'+
      '<a href="tel:'+esc(p.telefono.replace(/[^\d+]/g,""))+'">📞 '+esc(p.telefono)+'</a>'+
      (p.direccion?'<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.direccion)+'">📍 '+esc(p.direccion)+'</a>':'')+'</p>'+
      (p.aclaracion?'<p class="nota-cli">'+esc(p.aclaracion)+'</p>':'')+'<ul class="lista">';
    p.pedido_renglones.slice().sort(function(x,y){return x.id-y.id}).forEach(function(r){h+="<li><span>"+r.cantidad+" × "+esc(r.nombre)+"</span><span>"+plata(r.cantidad*r.precio)+"</span></li>"});
    if(p.descuento)h+="<li><span>Descuento</span><span>−"+plata(p.descuento)+"</span></li>";
    h+='</ul><div class="total"><span>Total · '+p.sandwiches+' sándwiches</span><span>'+plata(p.total)+'</span></div><div class="acciones">';
    if(s)h+='<button type="button" class="boton" data-estado="'+s[0]+'" data-id="'+p.id+'">'+s[1]+'</button>';
    h+='<div class="dos"><a class="boton wa" target="_blank" rel="noopener" href="'+esc(avisoWa(p))+'">Avisarle por WhatsApp</a>'+
      '<label class="cobro'+(p.cobrado?" si":"")+'"><input type="checkbox" data-cobro="'+p.id+'"'+(p.cobrado?" checked":"")+'>'+(p.cobrado?"Cobrado":"Marcar cobrado")+'</label></div>';
    if(a||p.estado!=="cancelado"){h+='<details><summary>Más opciones</summary><div class="dos">'+
      (a?'<button type="button" class="boton suave" data-estado="'+a+'" data-id="'+p.id+'">'+(p.estado==="cancelado"?"Reabrir el pedido":"Volver un paso atrás")+'</button>':"<span></span>")+
      (p.estado!=="cancelado"?'<button type="button" class="boton suave" data-estado="cancelado" data-id="'+p.id+'">Cancelar el pedido</button>':"")+'</div></details>'}
    return h+"</div></div>"}
  function pintarPedidos(){var H=hoy(),fechas={};pedidos.forEach(function(p){if(p.fecha_entrega>=H)fechas[p.fecha_entrega]=1});
    var op=[["proximos","Por hacer"]].concat(Object.keys(fechas).sort().map(function(f){return [f,fechaCorta(f)]}),[["todos","Todos"]]);
    if(!op.some(function(o){return o[0]===filtro}))filtro="proximos";
    $("filtro").innerHTML=op.map(function(o){return '<button type="button" data-filtro="'+o[0]+'" aria-pressed="'+(o[0]===filtro)+'">'+o[1]+'</button>'}).join("");
    var l=pedidos.filter(function(p){return filtro==="todos"?true:filtro==="proximos"?(p.estado!=="entregado"&&p.estado!=="cancelado"):p.fecha_entrega===filtro});
    l.sort(function(a,b){return filtro==="todos"?(b.fecha_entrega.localeCompare(a.fecha_entrega)||b.numero-a.numero):
      (a.fecha_entrega.localeCompare(b.fecha_entrega)||a.numero-b.numero)}); /* sin reordenar por estado: que las tarjetas no salten al tocar */
    $("lista-pedidos").innerHTML=l.length?l.map(tarjeta).join(""):'<p class="vacio">'+(filtro==="proximos"?"No hay pedidos por hacer. 🎉":"No hay pedidos acá.")+'</p>'}

  var PRONTO={recetas:["Recetas","Acá vas a cargar qué lleva cada sándwich y cuántos gramos. Con eso el sistema calcula solo cuánto te cuesta cada uno. Viene en el próximo paso."],
    stock:["Stock","Acá vas a anotar lo que comprás, y el sistema te va a decir cuánto te queda y para cuántos sándwiches te alcanza. Viene después de las recetas."],
    numeros:["Números","Acá vas a ver cuánto ganás con cada sándwich, las ventas por categoría y el ranking de lo que más se vende. Viene después de recetas y stock."]};
  function pintar(){if(!listo)return;
    var n=pedidos.filter(function(p){return p.estado==="nuevo"}).length;$("globo").hidden=!n;$("globo").textContent=n;
    document.querySelectorAll("[data-ir]").forEach(function(b){if(b.closest(".nav"))b.setAttribute("aria-current",b.dataset.ir===vista?"page":"false")});
    $("v-inicio").hidden=vista!=="inicio";$("v-pedidos").hidden=vista!=="pedidos";$("v-pronto").hidden=!PRONTO[vista];
    if(vista==="inicio")pintarInicio();else if(vista==="pedidos")pintarPedidos();
    else{$("pronto-t").textContent=PRONTO[vista][0];$("pronto-d").textContent=PRONTO[vista][1]}}

  function cambiar(id,cambio){var p=pedidos.filter(function(x){return x.id===id})[0];if(!p)return;
    var antes={};Object.keys(cambio).forEach(function(k){antes[k]=p[k];p[k]=cambio[k]});pintar();reparto();
    llamar("pedidos?id=eq."+id,{metodo:"PATCH",cuerpo:cambio}).catch(function(){
      Object.keys(antes).forEach(function(k){p[k]=antes[k]});pintar();reparto();
      $("falla").hidden=false;$("falla").textContent="No se pudo guardar el cambio. Probá de nuevo."})}

  /* ---------- ubicación mientras hay un envío en camino ---------- */
  var reloj=null,ultimo=0,pantalla=null;
  function reparto(){var n=pedidos.filter(function(p){return p.estado==="en_camino"&&p.entrega==="envio"}).length;
    if(!n){if(reloj!==null){navigator.geolocation.clearWatch(reloj);reloj=null}if(pantalla){try{pantalla.release()}catch(e){}pantalla=null}$("gps").hidden=true;return}
    $("gps").hidden=false;
    if(!navigator.geolocation){$("gps").textContent="Este celular no deja compartir la ubicación.";return}
    if(reloj===null){$("gps").textContent="Buscando tu ubicación…";
      reloj=navigator.geolocation.watchPosition(function(pos){
        $("gps").textContent="📍 "+(n===1?"El cliente está viendo":"Los clientes están viendo")+" por dónde vas. Dejá esta pantalla abierta hasta entregar.";
        if(Date.now()-ultimo<12000)return;ultimo=Date.now();
        llamar("reparto?id=eq.1",{metodo:"PATCH",cuerpo:{lat:pos.coords.latitude,lng:pos.coords.longitude,hora:new Date().toISOString()}}).catch(function(){})
      },function(){$("gps").textContent="No pudimos ver tu ubicación. Activá el GPS y dale permiso a esta página para que el cliente te vea en el mapa."},
      {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
      if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){pantalla=w},function(){})}}

  /* ---------- entrar y salir ---------- */
  function afuera(){guardar(null);listo=false;if(reloj!==null){navigator.geolocation.clearWatch(reloj);reloj=null}
    $("entrada").hidden=false;$("adentro").hidden=true;$("nav").hidden=true;$("salir").hidden=true;$("sin-permiso").hidden=true}
  function adentro(){$("entrada").hidden=true;$("salir").hidden=false;
    llamar("rpc/es_dueno",{cuerpo:{}}).then(function(ok){if(!S)return;
      if(!ok){$("sin-permiso").hidden=false;return}
      $("adentro").hidden=false;$("nav").hidden=false;traer()})
    .catch(function(){if(S){$("adentro").hidden=false;$("falla").hidden=false;$("falla").textContent="No pudimos conectar. Revisá la conexión y recargá."}})}
  var creando=false;
  function modo(c){creando=c;$("entrada-t").textContent=c?"Crear mi cuenta":"Entrar";$("campo-nombre").hidden=!c;$("entrada-b").textContent=c?"Crear mi cuenta":"Entrar";
    $("modo").textContent=c?"Ya tengo cuenta: entrar":"Es mi primera vez: crear mi cuenta";$("clave").autocomplete=c?"new-password":"current-password";$("entrada-error").hidden=true}
  $("modo").addEventListener("click",function(){$("entrada-ok").hidden=true;modo(!creando)});
  $("entrada").addEventListener("submit",function(e){e.preventDefault();var b=$("entrada-b"),m=$("mail").value.trim(),c=$("clave").value,falta="";
    var mal=function(t){b.disabled=false;$("entrada-error").hidden=false;$("entrada-error").textContent=t};
    $("entrada-error").hidden=true;$("entrada-ok").hidden=true;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m))falta="Revisá el mail.";
    else if(creando&&!$("nombre").value.trim())falta="Falta tu nombre.";
    else if(creando&&c.length<8)falta="La contraseña tiene que tener 8 letras o números como mínimo.";
    else if(!c)falta="Falta la contraseña.";
    if(falta){mal(falta);return}
    b.disabled=true;
    if(!creando){ficha("password",{email:m,password:c}).then(function(){b.disabled=false;$("clave").value="";adentro()},
      function(er){mal(er.estado?"El mail o la contraseña no coinciden.":"No pudimos conectar. Revisá la conexión.")});return}
    fetch(BASE.url+"/auth/v1/signup",{method:"POST",headers:{apikey:BASE.clave,"Content-Type":"application/json"},
      body:JSON.stringify({email:m,password:c,data:{nombre:$("nombre").value.trim().slice(0,60)}})})
      .then(function(r){return r.json().then(function(j){
        if(!r.ok){mal(r.status===429?"Se hicieron muchos intentos. Esperá un rato y probá de nuevo.":r.status===422||r.status===400?"Ese mail ya tiene cuenta, o la contraseña es muy fácil. Probá entrar o cambiá la contraseña.":"No se pudo crear la cuenta.");return}
        b.disabled=false;$("clave").value="";modo(false);
        if(j.access_token){guardar(j);adentro()}
        else{$("entrada-ok").hidden=false;$("entrada-ok").textContent="Cuenta creada. Te mandamos un mail para confirmarla: abrilo y después entrá acá."}})})
      .catch(function(){mal("No pudimos conectar. Revisá la conexión.")})});
  $("salir").addEventListener("click",afuera);
  document.addEventListener("click",function(e){
    var ir=e.target.closest("[data-ir]"),d=e.target.closest("[data-dia]"),f=e.target.closest("[data-filtro]"),es=e.target.closest("[data-estado]");
    if(ir){vista=ir.dataset.ir;pintar();window.scrollTo(0,0);return}
    if(d){vista="pedidos";filtro=d.dataset.dia;pintar();window.scrollTo(0,0);return}
    if(f){filtro=f.dataset.filtro;pintar();return}
    if(es){if(es.dataset.estado==="cancelado"&&!confirm("¿Cancelar este pedido? Se liberan sus lugares."))return;
      cambiar(es.dataset.id,{estado:es.dataset.estado,cambio:new Date().toISOString()})}});
  document.addEventListener("change",function(e){var c=e.target.closest("[data-cobro]");if(c)cambiar(c.dataset.cobro,{cobrado:c.checked})});
  setInterval(function(){if(S&&listo&&!document.hidden)traer()},30000);
  document.addEventListener("visibilitychange",function(){if(S&&listo&&!document.hidden)traer()});
  if(S&&S.a)adentro();else afuera();
})();
</script>
