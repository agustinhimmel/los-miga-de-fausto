<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mi cuenta · Los Miga de Fausto</title>
<meta name="theme-color" content="#d5202c">
<link rel="icon" type="image/png" href="../img/fausto.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --pan:#fbf8f6; --papel:#ffffff; --tinta:#2b1416; --tinta2:#6d5557; --linea:#ebe0de;
  --rojo:#d5202c; --rojo-suave:#fde9e9; --verde:#1f6b4f; --verde-suave:#e2f3ea; --wa:#128c4a;
  --ambar:#8a5a00; --ambar-suave:#fff1cf; --azul:#1d5fa8; --azul-suave:#e3effb;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --texto:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --pan:#120a0b; --papel:#1c1012; --tinta:#f8f0ef; --tinta2:#b9a3a4; --linea:#38262a;
  --rojo:#ff5a63; --rojo-suave:#3a171b; --verde:#7fd0ac; --verde-suave:#16302a; --wa:#2fbf71;
  --ambar:#f2c230; --ambar-suave:#3a2e10; --azul:#8fc0f5; --azul-suave:#14283d; color-scheme:dark } }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pan);color:var(--tinta);font:16px/1.45 var(--texto)}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.marco{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.cab{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.cab img{width:40px;height:40px;border-radius:50%}
.cab h1{font-size:20px;flex:1}
.cab .a-tienda{font-size:13px;color:var(--tinta2);font-weight:600;white-space:nowrap}
.cab button{background:none;border:1px solid var(--linea);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--tinta2);cursor:pointer}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:16px;margin-bottom:12px}
.tarjeta h2{font-size:18px;margin-bottom:10px}
.chica{font-size:13px;color:var(--tinta2);margin:0}
.campo{display:grid;gap:6px;margin-bottom:12px}
.campo label{font-size:13px;font-weight:600}
.campo input{border:1px solid var(--linea);background:var(--pan);border-radius:12px;padding:12px;width:100%}
.boton{display:block;width:100%;border:0;border-radius:12px;padding:13px 14px;background:var(--rojo);color:#fff;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
@media (prefers-color-scheme: dark){.boton{color:#1a0406}}
.boton:disabled{opacity:.55}
.boton.suave{background:var(--pan);color:var(--tinta);border:1px solid var(--linea)}
.boton.wa{background:var(--wa);color:#fff}
.dos-campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.con-ver{position:relative}
.con-ver input{padding-right:64px}
.con-ver .ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px 10px;font-size:13px;font-weight:700;color:var(--tinta2);cursor:pointer}
.fuerza{height:6px;border-radius:99px;background:var(--linea);overflow:hidden;margin-top:4px}
.fuerza i{display:block;height:100%;width:0;border-radius:99px;background:var(--rojo);transition:width .2s,background-color .2s}
.requisitos{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:13px;color:var(--tinta2)}
.requisitos li::before{content:"○";display:inline-block;width:18px}
.requisitos li.si{color:var(--verde);font-weight:600}
.requisitos li.si::before{content:"✓"}
.requisitos li.no{color:var(--rojo);font-weight:600}
.requisitos li.no::before{content:"✕"}
#fuerza-texto{margin-top:6px}
#coincide.si{color:var(--verde);font-weight:600}
#coincide.no{color:var(--rojo);font-weight:600}
.campo input.mal{border-color:var(--rojo)}
.campo input.bien{border-color:var(--verde)}
.enlace{display:block;width:100%;background:none;border:0;padding:12px 0 4px;font-size:14px;color:var(--tinta2);text-decoration:underline;cursor:pointer}
.aviso-ok{background:var(--verde-suave);color:var(--verde);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin:0 0 10px}
.error{color:var(--rojo);font-size:14px;font-weight:600;margin:0 0 10px}
.numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.numeros div{background:var(--pan);border-radius:12px;padding:10px}
.numeros b{display:block;font-family:var(--display);font-size:20px;line-height:1.1;overflow-wrap:anywhere}
.numeros span{font-size:12px;color:var(--tinta2)}
.aviso{display:flex;align-items:center;gap:12px;background:var(--ambar-suave);color:var(--ambar);border-radius:14px;padding:14px;margin-bottom:12px;border:0;width:100%;text-align:left;cursor:pointer;font-weight:700}
.aviso b{font-family:var(--display);font-size:26px}
.dia-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dia-cab small{color:var(--tinta2);font-size:13px}
.medidor{height:8px;background:var(--pan);border-radius:99px;overflow:hidden;margin:8px 0 12px}
.medidor i{display:block;height:100%;background:var(--rojo);border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 0;border-top:1px solid var(--linea);text-align:left}
td:last-child,th:last-child{text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--tinta2);font-weight:600;border-top:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 10px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--linea);background:var(--papel);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--tinta);color:var(--pan);border-color:var(--tinta)}
.pedido.apagado{opacity:.6}
.pedido-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pedido-cab h3{font-size:18px}
.pedido-cab small{font:500 13px var(--texto);color:var(--tinta2)}
.estado{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.e-nuevo{background:var(--ambar-suave);color:var(--ambar)}
.e-confirmado,.e-en_preparacion{background:var(--azul-suave);color:var(--azul)}
.e-en_camino{background:var(--rojo-suave);color:var(--rojo)}
.e-entregado{background:var(--verde-suave);color:var(--verde)}
.e-cancelado{background:var(--pan);color:var(--tinta2);text-decoration:line-through}
.datos{font-size:14px;margin:0 0 8px;display:grid;gap:3px}
.datos a{color:inherit}
.nota-cli{background:var(--ambar-suave);color:var(--ambar);border-radius:10px;padding:8px 10px;font-size:14px;margin:0 0 8px}
.lista{list-style:none;margin:0 0 8px;padding:0;font-size:14px}
.lista li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.total{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--linea);padding-top:8px;margin-bottom:12px}
.acciones{display:grid;gap:8px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cobro{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:10px 12px;border:1px solid var(--linea);border-radius:12px;cursor:pointer;justify-content:center}
.cobro input{width:18px;height:18px;accent-color:var(--verde)}
.cobro.si{background:var(--verde-suave);color:var(--verde);border-color:transparent}
details summary{font-size:13px;color:var(--tinta2);cursor:pointer;padding:4px 0}
details .dos{margin-top:8px}
.gps{background:var(--rojo-suave);color:var(--rojo);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:1px solid var(--linea);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav div{display:flex;width:100%;max-width:760px}
.nav button{flex:1;background:none;border:0;padding:10px 2px 12px;font-size:12px;font-weight:600;color:var(--tinta2);cursor:pointer;display:grid;gap:2px;justify-items:center;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--rojo)}
.nav .globo{position:absolute;top:4px;left:calc(50% + 6px);background:var(--rojo);color:#fff;border-radius:99px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}
@media (min-width:900px){
  .marco{max-width:1280px;padding:28px 40px 60px}
  body:has(.nav:not([hidden])) .marco{margin-left:228px;max-width:none}
  .cab h1{font-size:26px}
  #entrada,#espera-mail{max-width:460px;margin:48px auto;padding:28px}
  .nav{top:0;bottom:0;right:auto;width:228px;border-top:0;border-right:1px solid var(--linea);padding:28px 14px;justify-content:flex-start;align-items:flex-start}
  .nav div{flex-direction:column;gap:4px}
  .nav button{flex:none;display:flex;align-items:center;justify-content:flex-start;gap:14px;font-size:15px;padding:13px 14px;border-radius:12px;width:100%}
  .nav button:hover{background:var(--pan);color:var(--tinta)}
  .nav button[aria-current="page"]{background:var(--rojo-suave)}
  .nav .globo{position:static;margin-left:auto}
  #lista-pedidos{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px;align-items:start}
  #lista-pedidos > .tarjeta{margin:0;padding:22px}
  #lista-pedidos > .vacio{grid-column:1/-1}
  .chips{flex-wrap:wrap;overflow:visible;margin:0 0 18px;padding:0}
  .chips button{font-size:15px;padding:10px 18px}
  .chips button:hover{border-color:var(--tinta)}
  .boton{transition:filter .15s}.boton:hover:not(:disabled){filter:brightness(1.08)}
}
.vacio{text-align:center;color:var(--tinta2);padding:28px 8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="marco">
  <header class="cab">
    <img src="../img/fausto.png" alt="">
    <h1 id="titulo">Los Miga de Fausto</h1>
    <a class="a-tienda" href="../">Ir a la tienda</a>
    <button type="button" id="salir" hidden>Salir</button>
  </header>

  <form class="tarjeta" id="entrada" hidden novalidate>
    <h2 id="entrada-t">Entrar</h2>
    <p class="chica" id="entrada-sub" style="margin-bottom:12px" hidden></p>
    <div class="dos-campos" id="campo-nombre" hidden>
      <div class="campo"><label for="nombre">Nombre</label><input id="nombre" autocomplete="given-name" autocapitalize="words"></div>
      <div class="campo"><label for="apellido">Apellido</label><input id="apellido" autocomplete="family-name" autocapitalize="words"></div></div>
    <div class="campo" id="campo-cel" hidden><label for="cel">Tu celular</label><input id="cel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej: 11 5555 5555"></div>
    <div class="campo" id="campo-mail"><label for="mail">Mail</label><input id="mail" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false"></div>
    <div class="campo" id="campo-clave"><label for="clave" id="clave-l">Contraseña</label>
      <div class="con-ver"><input id="clave" type="password" autocomplete="current-password"><button type="button" class="ver" data-verclave="clave">Ver</button></div>
      <div id="clave-ayuda" hidden>
        <div class="fuerza"><i id="fuerza-barra"></i></div>
        <p class="chica" id="fuerza-texto">Tiene que tener:</p>
        <ul class="requisitos">
          <li id="req-largo">8 caracteres o más</li>
          <li id="req-letra">Al menos una letra</li>
          <li id="req-numero">Al menos un número</li>
        </ul>
      </div></div>
    <div class="campo" id="campo-clave2" hidden><label for="clave2">Repetí la contraseña</label>
      <div class="con-ver"><input id="clave2" type="password" autocomplete="new-password"><button type="button" class="ver" data-verclave="clave2">Ver</button></div>
      <small class="chica" id="coincide"></small></div>
    <p class="error" id="entrada-error" hidden></p>
    <p class="aviso-ok" id="entrada-ok" hidden></p>
    <button class="boton" type="submit" id="entrada-b">Entrar</button>
    <button class="boton suave" type="button" id="reenviar" style="margin-top:8px" hidden>Mandarme de nuevo el mail de confirmación</button>
    <button class="enlace" type="button" id="olvide">Olvidé mi contraseña</button>
    <button class="boton suave" type="button" id="modo" style="margin-top:8px">Es mi primera vez: crear mi cuenta</button>
  </form>

  <div class="tarjeta" id="espera-mail" hidden><h2>Un segundo…</h2><p class="chica">Estamos entrando a tu cuenta.</p></div>

  <main id="adentro" hidden>
    <div class="gps" id="gps" hidden></div>
    <p class="error" id="falla" hidden></p>
    <section id="v-inicio"></section>
    <section id="v-pedidos" hidden>
      <div class="chips" id="filtro"></div>
      <div id="lista-pedidos"></div>
    </section>
    <section id="v-extra" hidden></section>
  </main>
</div>

<nav class="nav" id="nav" hidden><div>
  <button type="button" data-ir="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>Inicio</button>
  <button type="button" data-ir="pedidos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Pedidos<span class="globo" id="globo" hidden></span></button>
  <button type="button" data-ir="productos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.5 12a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2zM9 7V5a3 3 0 0 1 6 0v2"/></svg>Productos</button>
  <button type="button" data-ir="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg>Stock</button>
  <button type="button" data-ir="estadisticas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Estadísticas</button>
</div></nav>

<script>
(function(){
  var BASE={url:"https://ikptgfyfqvgrhhemvzly.supabase.co",clave:"sb_publishable_Mk65UgFQ0zPuubaz0SMXpg_IJTNdh16"};
  var $=function(id){return document.getElementById(id)};
  var plata=function(n){return "$"+Math.round(n).toLocaleString("es-AR")};
  function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  var DC=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  function fechaCorta(f){var a=f.split("-"),d=new Date(+a[0],a[1]-1,+a[2]);return DC[d.getDay()]+" "+(+a[2])+"/"+(+a[1])}
  function hoy(){return new Date().toLocaleDateString("en-CA",{timeZone:"America/Argentina/Buenos_Aires"})}
  function masDias(f,n){var a=f.split("-"),d=new Date(Date.UTC(+a[0],a[1]-1,+a[2]+n));return d.toISOString().slice(0,10)}

  /* ---------- sesión ---------- */
  var S=null;
  try{S=JSON.parse(localStorage.getItem("miga-panel")||"null")}catch(e){}
  function guardar(j){S=j?{a:j.access_token,r:j.refresh_token,v:Date.now()+(j.expires_in||3600)*1000,m:j.user&&j.user.email}:null;
    try{if(S)localStorage.setItem("miga-panel",JSON.stringify(S));else localStorage.removeItem("miga-panel")}catch(e){}}
  function ficha(tipo,cuerpo){
    return fetch(BASE.url+"/auth/v1/token?grant_type="+tipo,{method:"POST",headers:{apikey:BASE.clave,"Content-Type":"application/json"},body:JSON.stringify(cuerpo)})
      .then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error("no");e.estado=r.status;e.codigo=j.error_code||j.error||"";throw e}guardar(j);return j})})}
  var renovando=null;
  function renovar(){if(!renovando)renovando=ficha("refresh_token",{refresh_token:S.r}).then(function(x){renovando=null;return x},function(e){renovando=null;if(e.estado)afuera();throw e});return renovando}
  function llamar(camino,opt){opt=opt||{};
    var ir=function(){return fetch(BASE.url+"/rest/v1/"+camino,{method:opt.metodo||(opt.cuerpo?"POST":"GET"),body:opt.cuerpo?JSON.stringify(opt.cuerpo):undefined,
      headers:{apikey:BASE.clave,Authorization:"Bearer "+S.a,"Content-Type":"application/json",Prefer:opt.metodo==="PATCH"?"return=minimal":"return=representation"}})};
    var antes=S.v-Date.now()<60000?renovar():Promise.resolve();
    return antes.then(ir).then(function(r){if(r.status===401)return renovar().then(ir);return r})
      .then(function(r){if(!r.ok)return r.json().catch(function(){return {}}).then(function(j){var e=new Error("La base contestó "+r.status);if(j&&j.code==="P0001")e.dicho=j.message;else if(j&&j.code==="23505")e.dicho="Ya existe uno con ese nombre.";throw e});
        return r.status===204?null:r.text().then(function(t){return t?JSON.parse(t):null})})}

  /* ---------- datos ---------- */
  var pedidos=[],contenido={},productos={},dias={},vista="inicio",filtro="proximos",listo=false;
  var ORDEN={nuevo:0,confirmado:1,en_preparacion:2,en_camino:3,entregado:4,cancelado:5};
  function nombreEstado(p){return {nuevo:"Nuevo",confirmado:"Confirmado",en_preparacion:"En preparación",en_camino:p.entrega==="envio"?"En camino":"Listo para retirar",entregado:"Entregado",cancelado:"Cancelado"}[p.estado]}
  function siguiente(p){return {nuevo:["confirmado","Confirmar pedido"],confirmado:["en_preparacion","Empezar a preparar"],
    en_preparacion:["en_camino",p.entrega==="envio"?"Salgo a entregar":"Ya está listo para retirar"],en_camino:["entregado","Entregado"]}[p.estado]}
  function anterior(p){return {confirmado:"nuevo",en_preparacion:"confirmado",en_camino:"en_preparacion",entregado:"en_camino",cancelado:"nuevo"}[p.estado]}
  function vivo(p){return p.estado!=="cancelado"}

  function traer(){
    var desde=masDias(hoy(),-400);
    return Promise.all([
      llamar("pedidos?select=*,pedido_renglones(*)&fecha_entrega=gte."+desde+"&order=fecha_entrega.asc,numero.asc"),
      llamar("producto_contenido?select=*"),llamar("productos?select=*"),llamar("dias_entrega?select=*")
    ]).then(function(r){
      pedidos=r[0];contenido={};productos={};dias={};
      r[1].forEach(function(c){(contenido[c.producto_id]=contenido[c.producto_id]||[]).push(c)});
      r[2].forEach(function(p){productos[p.id]=p});r[3].forEach(function(d){dias[d.fecha]=d});
      return (window.MIGA&&MIGA.cargar?MIGA.cargar():Promise.resolve()).then(function(){listo=true;$("falla").hidden=true;pintar();reparto()});
    }).catch(function(e){if(S){$("falla").hidden=false;$("falla").textContent="No pudimos traer los pedidos. Revisá la conexión."}})}

  /* cuánto hay que hacer de cada gusto, y qué más hay que tener */
  function produccion(lista){var g={},x={};
    lista.forEach(function(p){p.pedido_renglones.forEach(function(r){var pr=productos[r.producto_id]||{};
      if(pr.tipo==="gusto")g[r.producto_id]=(g[r.producto_id]||0)+r.cantidad;
      (contenido[r.producto_id]||[]).forEach(function(c){g[c.gusto_id]=(g[c.gusto_id]||0)+c.cantidad*r.cantidad});
      if(pr.tipo==="extra")x[r.producto_id]=(x[r.producto_id]||0)+r.cantidad})});
    var ord=function(o){return Object.keys(o).sort(function(a,b){return ((productos[a]||{}).orden||0)-((productos[b]||{}).orden||0)}).map(function(id){return {id:id,n:(productos[id]||{}).nombre||id,c:o[id]}})};
    return {gustos:ord(g),extras:ord(x)}}

  /* ---------- inicio ---------- */
  function pintarInicio(){var h="",H=hoy(),nuevos=pedidos.filter(function(p){return p.estado==="nuevo"}).length;

      return '<div class="tarjeta"><div class="dia-cab"><h2>'+esc(i.nombre)+'</h2><small>rinde '+cant(i.rendimiento||0,i.unidad)+" · sale "+plata(ed.total)+" · "+porUnidad(i)+'</small></div>'+(i.nota?'<p class="chica" style="margin:6px 0">'+esc(i.nota)+'</p>':"")+ed.html+'<div class="g-acc" style="margin-top:10px"><button type="button" class="mini" data-editar="'+i.id+'">Cambiar nombre o rendimiento</button></div></div>'}).join("")||'<div class="tarjeta"><p class="chica">No hay preparaciones cargadas.</p></div>';
    if(est.tab==="movimientos"){var mov=compras.map(function(c){return {f:c.fecha,t:"Compra",n:(porId[c.insumo_id]||{}).nombre,d:"+"+cant(c.cantidad,(porId[c.insumo_id]||{}).unidad),p:plata(c.total),k:c.creado}}).concat(prods.map(function(c){return {f:c.fecha,t:"Producción",n:(M.datos().productos[c.producto_id]||{}).nombre,d:nro(c.armadas,1)+" armadas",p:"",k:c.creado}})).sort(function(a,b){return b.k.localeCompare(a.k)});
      h+='<div class="tarjeta">'+(mov.length?'<div class="rueda"><table class="tabla"><tr><th>Fecha</th><th>Movimiento</th><th>Qué</th><th class="num">Cantidad</th><th class="num">Pagaste</th></tr>'+mov.map(function(m){return '<tr><td>'+M.fechaCorta(m.f)+'</td><td><span class="pill '+(m.t==="Compra"?"bien":"gris")+'">'+m.t+'</span></td><td>'+esc(m.n||"")+'</td><td class="num">'+m.d+'</td><td class="num">'+m.p+'</td></tr>'}).join("")+'</table></div>':'<p class="chica">Todavía no anotaste compras ni producción.</p>')+'</div>'}
    el.innerHTML=h};

  /* =================== ESTADÍSTICAS =================== */
  M.vistas.estadisticas=function(el){var H=M.hoy(),todo=ventas(),P=est.periodo,desde=P==="todo"?"2000-01-01":M.masDias(H,-(P-1)),l=enRango(todo,desde,H),r=resumen(l);
    var ant=P==="todo"?null:resumen(enRango(todo,M.masDias(desde,-P),M.masDias(desde,-1))),reales=M.datos().pedidos.filter(function(p){return p.estado!=="cancelado"}).length;
    var h='<div class="g-titulo"><div><h2>Estadísticas</h2><p class="chica">Según la fecha en que entró cada pedido. No cuenta los cancelados.</p></div><div class="chips" style="margin:0;padding:0">'+
      [[7,"7 días"],[30,"30 días"],[90,"90 días"],[365,"1 año"],["todo","Todo"]].map(function(o){return '<button type="button" data-periodo="'+o[0]+'" aria-pressed="'+(String(P)===String(o[0]))+'">'+o[1]+'</button>'}).join("")+'</div></div>';
    if(est.demo)h+='<div class="demo-aviso"><span>⚠ Estás viendo DATOS DE EJEMPLO, inventados para mostrar cómo se ve. No son ventas reales.</span><button type="button" class="mini" data-demo="0">Volver a mis datos</button></div>';
    else if(reales<5)h+='<div class="demo-aviso"><span>Todavía hay pocas ventas cargadas ('+reales+'). Podés ver cómo queda esta pantalla con datos de ejemplo.</span><button type="button" class="mini" data-demo="1">Ver con datos de ejemplo</button></div>';
    var d=function(a,b){return ant?delta(a,b):["",""]},dv=d(r.total,ant&&ant.total),dn=d(r.n,ant&&ant.n),dt=d(r.ticket,ant&&ant.ticket),ds=d(r.sand,ant&&ant.sand);
    h+='<div class="kpis">'+kpi("Ventas",plata(r.total),dv[0],"",dv[1])+kpi("Pedidos",r.n,dn[0],"",dn[1])+kpi("Ticket promedio",plata(r.ticket),dt[0],"",dt[1])+kpi("Sándwiches",nro(r.sand),ds[0],"",ds[1])+
      kpi("Ganancia estimada",plata(r.ganancia),r.margen==null?"faltan costos":"margen "+pct(r.margen)+(r.sinCosto?" · sin contar "+plata(r.sinCosto)+" de productos sin costo":""))+kpi("Cobrado",pct(r.total?r.cobrado/r.total:null),plata(r.total-r.cobrado)+" por cobrar")+'</div>';
    if(!l.length){el.innerHTML=h+'<div class="tarjeta"><p class="chica">No hay ventas en este período.</p></div>';return}
    /* por día */
    var nd=P==="todo"?Math.min(120,Math.max(14,Math.round((new Date(H)-new Date(l.map(function(p){return diaAR(p.creado)}).sort()[0]))/864e5)+1)):Math.min(P,120),serie=[],ini=M.masDias(H,-(nd-1)),mapa={};
    l.forEach(function(p){var k=diaAR(p.creado);mapa[k]=mapa[k]||{v:0,n:0};mapa[k].v+=p.total;mapa[k].n++});
    for(var k=0;k<nd;k++){var f=M.masDias(ini,k);serie.push({f:f,v:(mapa[f]||{v:0}).v,n:(mapa[f]||{n:0}).n})}
    h+='<div class="g-grid dos"><div class="tarjeta ancho"><h2>Ventas por día</h2>'+grafDias(serie)+(P===365||P==="todo"?'<p class="g-nota">Se muestran los últimos '+nd+' días.</p>':"")+'</div>';
    /* por categoría y por producto */
    var cat={},prod={},gus={};l.forEach(function(p){p.pedido_renglones.forEach(function(x){var pr=M.datos().productos[x.producto_id]||{pestana:"otros",nombre:x.nombre},plataL=x.cantidad*x.precio;
      cat[pr.pestana]=cat[pr.pestana]||{v:0,u:0};cat[pr.pestana].v+=plataL;cat[pr.pestana].u+=x.cantidad;
      prod[x.producto_id]=prod[x.producto_id]||{n:pr.nombre||x.nombre,c:pr.pestana,v:0,u:0};prod[x.producto_id].v+=plataL;prod[x.producto_id].u+=x.cantidad;
      if(pr.tipo==="gusto")gus[x.producto_id]=(gus[x.producto_id]||0)+x.cantidad;(M.datos().contenido[x.producto_id]||[]).forEach(function(c){gus[c.gusto_id]=(gus[c.gusto_id]||0)+c.cantidad*x.cantidad})})});
    var bruto=Object.keys(cat).reduce(function(a,k){return a+cat[k].v},0)||1,lp=Object.keys(prod).map(function(k){return prod[k]});
    h+='<div class="tarjeta"><h2>Ventas por categoría</h2>'+barrasH(CATS.filter(function(c){return cat[c]}).map(function(c){return {n:CAT[c],v:cat[c].v,x:pct(cat[c].v/bruto)}}).sort(function(a,b){return b.v-a.v}),plata)+'<p class="g-nota">A precio de lista, antes de descuentos ('+plata(r.desc)+' en el período).</p></div>';
    h+='<div class="tarjeta"><h2>Sándwiches por gusto</h2>'+barrasH(Object.keys(gus).map(function(k){return {n:(M.datos().productos[k]||{}).nombre||k,v:gus[k]}}).sort(function(a,b){return b.v-a.v}),function(v){return nro(v)},"Sin sándwiches en el período.")+'<p class="g-nota">Cuenta los sueltos y los que van dentro de los combos.</p></div>';
    h+='<div class="tarjeta"><h2>Ranking general por plata</h2>'+barrasH(lp.slice().sort(function(a,b){return b.v-a.v}).slice(0,10).map(function(x){return {n:x.n,v:x.v,x:nro(x.u)+" un"}}),plata)+'</div>';
    h+='<div class="tarjeta"><h2>Ranking general por unidades</h2>'+barrasH(lp.slice().sort(function(a,b){return b.u-a.u}).slice(0,10).map(function(x){return {n:x.n,v:x.u,x:plata(x.v)}}),function(v){return nro(v)})+'</div>';
    CATS.forEach(function(c){var li=lp.filter(function(x){return x.c===c}).sort(function(a,b){return b.v-a.v});if(!li.length)return;
      h+='<div class="tarjeta"><h2>Ranking de '+CAT[c]+'</h2><table class="tabla"><tr><th>#</th><th>Producto</th><th class="num">Unidades</th><th class="num">Plata</th><th class="num">Parte</th></tr>'+li.map(function(x,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(x.n)+'</td><td class="num">'+nro(x.u)+'</td><td class="num">'+plata(x.v)+'</td><td class="num">'+pct(x.v/cat[c].v)+'</td></tr>'}).join("")+'</table></div>'});
    /* cuándo y cómo */
    var sem=[0,0,0,0,0,0,0],ret=0,env=0,tr=0,ef=0;l.forEach(function(p){sem[new Date(diaAR(p.creado)+"T12:00:00").getDay()]+=p.total;if(p.entrega==="envio")env+=p.total;else ret+=p.total;if(p.pago==="efectivo")ef+=p.total;else tr+=p.total});
    h+='<div class="tarjeta"><h2>Qué día entran más pedidos</h2>'+barrasH([1,2,3,4,5,6,0].map(function(i){return {n:DSEM[i],v:sem[i]}}),plata)+'</div>';
    h+='<div class="tarjeta"><h2>Cómo lo reciben y cómo pagan</h2><p class="chica" style="margin-bottom:8px">Entrega</p>'+partes([{n:"Retiran",v:ret,c:"var(--tinta)"},{n:"Envío",v:env,c:"var(--rojo)"}])+
      '<p class="chica" style="margin:16px 0 8px">Pago</p>'+partes([{n:"Transferencia",v:tr,c:"var(--tinta)"},{n:"Efectivo",v:ef,c:"var(--rojo)"}])+'</div>';
    var cli={};l.forEach(function(p){var k=String(p.telefono).replace(/\D/g,"")||p.nombre;cli[k]=cli[k]||{n:p.nombre,c:0,v:0};cli[k].c++;cli[k].v+=p.total});
    h+='<div class="tarjeta ancho"><h2>Mejores clientes</h2><div class="rueda"><table class="tabla"><tr><th>#</th><th>Cliente</th><th class="num">Pedidos</th><th class="num">Compró</th><th class="num">Ticket</th></tr>'+Object.keys(cli).map(function(k){return cli[k]}).sort(function(a,b){return b.v-a.v}).slice(0,10).map(function(c,i){
      return '<tr><td>'+(i+1)+'</td><td>'+esc(c.n)+'</td><td class="num">'+c.c+'</td><td class="num">'+plata(c.v)+'</td><td class="num">'+plata(c.v/c.c)+'</td></tr>'}).join("")+'</table></div></div></div>';
    el.innerHTML=h};

  /* ---------- no pisar lo que se está escribiendo cuando el panel se refresca solo ---------- */
  Object.keys(M.vistas).forEach(function(k){var f=M.vistas[k];M.vistas[k]=function(el){var a=document.activeElement;
    if(!forzar&&a&&el.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;forzar=false;f(el)}});
  function pintar(){forzar=true;M.pintar()}
  function recargar(){forzar=true;return M.traer()}
  function fallo(e){forzar=true;alert(e&&e.dicho?e.dicho:"No se pudo guardar. Revisá la conexión y probá de nuevo.")}
  function num(v){var n=parseFloat(String(v).replace(/\./g,"").replace(",","."));return isFinite(n)?n:NaN}
  function numSimple(v){var n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:NaN}

  var caja=$("v-extra");
  caja.addEventListener("click",function(e){var t=e.target,x;
    if((x=t.closest("[data-prodficha]"))){est.prod=x.dataset.prodficha||null;pintar();window.scrollTo(0,0);return}
    if((x=t.closest("[data-stab]"))){est.tab=x.dataset.stab;pintar();return}
    if((x=t.closest("[data-form]"))){est.form=x.dataset.form||null;est.insumo=null;pintar();return}
    if((x=t.closest("[data-compra]"))){est.form="compra";est.insumo=x.dataset.compra;pintar();window.scrollTo(0,0);return}
    if((x=t.closest("[data-editar]"))){est.form="editar";est.insumo=x.dataset.editar;pintar();window.scrollTo(0,0);return}
    if((x=t.closest("[data-periodo]"))){est.periodo=x.dataset.periodo==="todo"?"todo":+x.dataset.periodo;pintar();return}
    if((x=t.closest("[data-demo]"))){est.demo=x.dataset.demo==="1";pintar();return}
    if((x=t.closest("[data-sugerido]"))){$("g-precio").value=x.dataset.sugerido;$("g-precio").focus();return}
    if((x=t.closest("[data-quitar]"))){if(!confirm("¿Quitar este ingrediente?"))return;
      var c=x.dataset.quitar==="receta"?"producto_receta?producto_id=eq."+encodeURIComponent(x.dataset.dueno)+"&insumo_id=eq."+x.dataset.ins:"insumo_formula?preparacion_id=eq."+x.dataset.dueno+"&insumo_id=eq."+x.dataset.ins;
      M.llamar(c,{metodo:"DELETE"}).then(recargar,fallo)}});
  caja.addEventListener("mousemove",function(e){var z=e.target.closest&&e.target.closest("[data-tip]"),tip=$("g-tip");
    if(!z){if(tip)tip.hidden=true;return}if(!tip){tip=document.createElement("div");tip.id="g-tip";document.body.appendChild(tip)}
    tip.hidden=false;tip.textContent=z.dataset.tip;tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px"});
  caja.addEventListener("mouseleave",function(){var tip=$("g-tip");if(tip)tip.hidden=true});
  caja.addEventListener("change",function(e){var t=e.target;
    if(t.dataset.activo){M.llamar("productos?id=eq."+encodeURIComponent(t.dataset.activo),{metodo:"PATCH",cuerpo:{activo:t.checked,actualizado:new Date().toISOString()}}).then(recargar,fallo);return}
    if(t.dataset.comp){var q=numSimple(t.value);if(!(q>0)){alert("Poné una cantidad mayor a cero.");return}
      var c=t.dataset.comp==="receta"?"producto_receta?producto_id=eq."+encodeURIComponent(t.dataset.dueno)+"&insumo_id=eq."+t.dataset.ins:"insumo_formula?preparacion_id=eq."+t.dataset.dueno+"&insumo_id=eq."+t.dataset.ins;
      M.llamar(c,{metodo:"PATCH",cuerpo:{cantidad:q}}).then(recargar,fallo)}});
  caja.addEventListener("submit",function(e){e.preventDefault();var f=e.target,d=new FormData(f),b=f.querySelector('[type="submit"]');
    var hecho=function(){est.form=null;est.insumo=null;return recargar()},mal=function(er){if(b)b.disabled=false;fallo(er)};
    if(f.dataset.precio){var p=Math.round(num(d.get("precio")));if(!(p>0)){alert("Poné un precio válido.");return}if(b)b.disabled=true;
      M.llamar("productos?id=eq."+encodeURIComponent(f.dataset.precio),{metodo:"PATCH",cuerpo:{precio:p,actualizado:new Date().toISOString()}}).then(recargar,mal);return}
    if(f.dataset.rinde){var r=Math.round(numSimple(d.get("rinde")));if(!(r>0)){alert("Poné cuántos sándwiches salen.");return}
      M.llamar("productos?id=eq."+encodeURIComponent(f.dataset.rinde),{metodo:"PATCH",cuerpo:{rinde:r}}).then(recargar,mal);return}
    if(f.dataset.agrega){var q=numSimple(d.get("q")),i=d.get("ins");if(!i||!(q>0)){alert("Elegí el ingrediente y la cantidad.");return}
      var cuerpo=f.dataset.agrega==="receta"?{producto_id:f.dataset.dueno,insumo_id:+i,cantidad:q}:{preparacion_id:+f.dataset.dueno,insumo_id:+i,cantidad:q};
      M.llamar(f.dataset.agrega==="receta"?"producto_receta":"insumo_formula",{cuerpo:cuerpo}).then(recargar,mal);return}
    if(f.dataset.guardar==="compra"){var qc=numSimple(d.get("q")),tc=numSimple(d.get("t"));if(!d.get("ins")||!(qc>0)||!(tc>=0)){alert("Completá qué compraste, la cantidad y el total.");return}if(b)b.disabled=true;
      M.llamar("rpc/registrar_compra",{cuerpo:{p_insumo:+d.get("ins"),p_cantidad:qc,p_total:tc,p_fecha:d.get("f")||null,p_nota:d.get("n")||null}}).then(hecho,mal);return}
    if(f.dataset.guardar==="produccion"){var a=numSimple(d.get("a"));if(!d.get("prod")||!(a>0)){alert("Elegí qué hiciste y cuántas armadas.");return}if(b)b.disabled=true;
      M.llamar("rpc/registrar_produccion",{cuerpo:{p_producto:d.get("prod"),p_armadas:a,p_fecha:d.get("f")||null,p_nota:null}}).then(hecho,mal);return}
    if(f.dataset.guardar==="insumo"){var n=String(d.get("nombre")||"").trim();if(n.length<2){alert("Falta el nombre.");return}
      var o={nombre:n,unidad:d.get("unidad"),stock:numSimple(d.get("stock"))||0,stock_minimo:numSimple(d.get("min"))||0,actualizado:new Date().toISOString()};
      if(d.has("precio")){o.precio_compra=numSimple(d.get("precio"))||null;o.cantidad_compra=numSimple(d.get("cantc"))||null}
      if(d.has("rend"))o.rendimiento=numSimple(d.get("rend"))||null;
      if(b)b.disabled=true;
      if(f.dataset.id)M.llamar("insumos?id=eq."+f.dataset.id,{metodo:"PATCH",cuerpo:o}).then(hecho,mal);
      else{o.es_preparacion=!!d.get("prep");M.llamar("insumos",{cuerpo:o}).then(hecho,mal)}}});
})();
</script>
