<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mi cuenta · Los Miga de Fausto</title>
<meta name="theme-color" content="#d5202c">
<link rel="icon" type="image/png" href="../img/fausto.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --pan:#fbf8f6; --papel:#ffffff; --tinta:#2b1416; --tinta2:#6d5557; --linea:#ebe0de;
  --rojo:#d5202c; --rojo-suave:#fde9e9; --verde:#1f6b4f; --verde-suave:#e2f3ea; --wa:#128c4a;
  --ambar:#8a5a00; --ambar-suave:#fff1cf; --azul:#1d5fa8; --azul-suave:#e3effb;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --texto:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --pan:#120a0b; --papel:#1c1012; --tinta:#f8f0ef; --tinta2:#b9a3a4; --linea:#38262a;
  --rojo:#ff5a63; --rojo-suave:#3a171b; --verde:#7fd0ac; --verde-suave:#16302a; --wa:#2fbf71;
  --ambar:#f2c230; --ambar-suave:#3a2e10; --azul:#8fc0f5; --azul-suave:#14283d; color-scheme:dark } }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pan);color:var(--tinta);font:16px/1.45 var(--texto)}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.marco{max-width:760px;margin:0 auto;padding:16px 16px 96px}
.cab{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.cab img{width:40px;height:40px;border-radius:50%}
.cab h1{font-size:20px;flex:1}
.cab .a-tienda{font-size:13px;color:var(--tinta2);font-weight:600;white-space:nowrap}
.cab button{background:none;border:1px solid var(--linea);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--tinta2);cursor:pointer}
.tarjeta{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:16px;margin-bottom:12px}
.tarjeta h2{font-size:18px;margin-bottom:10px}
.chica{font-size:13px;color:var(--tinta2);margin:0}
.campo{display:grid;gap:6px;margin-bottom:12px}
.campo label{font-size:13px;font-weight:600}
.campo input{border:1px solid var(--linea);background:var(--pan);border-radius:12px;padding:12px;width:100%}
.boton{display:block;width:100%;border:0;border-radius:12px;padding:13px 14px;background:var(--rojo);color:#fff;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}
@media (prefers-color-scheme: dark){.boton{color:#1a0406}}
.boton:disabled{opacity:.55}
.boton.suave{background:var(--pan);color:var(--tinta);border:1px solid var(--linea)}
.boton.wa{background:var(--wa);color:#fff}
.dos-campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.con-ver{position:relative}
.con-ver input{padding-right:64px}
.con-ver .ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;padding:8px 10px;font-size:13px;font-weight:700;color:var(--tinta2);cursor:pointer}
.fuerza{height:6px;border-radius:99px;background:var(--linea);overflow:hidden;margin-top:4px}
.fuerza i{display:block;height:100%;width:0;border-radius:99px;background:var(--rojo);transition:width .2s,background-color .2s}
.requisitos{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:13px;color:var(--tinta2)}
.requisitos li::before{content:"○";display:inline-block;width:18px}
.requisitos li.si{color:var(--verde);font-weight:600}
.requisitos li.si::before{content:"✓"}
.requisitos li.no{color:var(--rojo);font-weight:600}
.requisitos li.no::before{content:"✕"}
#fuerza-texto{margin-top:6px}
#coincide.si{color:var(--verde);font-weight:600}
#coincide.no{color:var(--rojo);font-weight:600}
.campo input.mal{border-color:var(--rojo)}
.campo input.bien{border-color:var(--verde)}
.enlace{display:block;width:100%;background:none;border:0;padding:12px 0 4px;font-size:14px;color:var(--tinta2);text-decoration:underline;cursor:pointer}
.aviso-ok{background:var(--verde-suave);color:var(--verde);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin:0 0 10px}
.error{color:var(--rojo);font-size:14px;font-weight:600;margin:0 0 10px}
.numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.numeros div{background:var(--pan);border-radius:12px;padding:10px}
.numeros b{display:block;font-family:var(--display);font-size:20px;line-height:1.1;overflow-wrap:anywhere}
.numeros span{font-size:12px;color:var(--tinta2)}
.aviso{display:flex;align-items:center;gap:12px;background:var(--ambar-suave);color:var(--ambar);border-radius:14px;padding:14px;margin-bottom:12px;border:0;width:100%;text-align:left;cursor:pointer;font-weight:700}
.aviso b{font-family:var(--display);font-size:26px}
.dia-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dia-cab small{color:var(--tinta2);font-size:13px}
.medidor{height:8px;background:var(--pan);border-radius:99px;overflow:hidden;margin:8px 0 12px}
.medidor i{display:block;height:100%;background:var(--rojo);border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 0;border-top:1px solid var(--linea);text-align:left}
td:last-child,th:last-child{text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--tinta2);font-weight:600;border-top:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 10px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--linea);background:var(--papel);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed="true"]{background:var(--tinta);color:var(--pan);border-color:var(--tinta)}
.pedido.apagado{opacity:.6}
.pedido-cab{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pedido-cab h3{font-size:18px}
.pedido-cab small{font:500 13px var(--texto);color:var(--tinta2)}
.estado{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.e-nuevo{background:var(--ambar-suave);color:var(--ambar)}
.e-confirmado,.e-en_preparacion{background:var(--azul-suave);color:var(--azul)}
.e-en_camino{background:var(--rojo-suave);color:var(--rojo)}
.e-entregado{background:var(--verde-suave);color:var(--verde)}
.e-cancelado{background:var(--pan);color:var(--tinta2);text-decoration:line-through}
.datos{font-size:14px;margin:0 0 8px;display:grid;gap:3px}
.datos a{color:inherit}
.nota-cli{background:var(--ambar-suave);color:var(--ambar);border-radius:10px;padding:8px 10px;font-size:14px;margin:0 0 8px}
.lista{list-style:none;margin:0 0 8px;padding:0;font-size:14px}
.lista li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.total{display:flex;justify-content:space-between;font-weight:700;border-top:1px solid var(--linea);padding-top:8px;margin-bottom:12px}
.acciones{display:grid;gap:8px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cobro{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:10px 12px;border:1px solid var(--linea);border-radius:12px;cursor:pointer;justify-content:center}
.cobro input{width:18px;height:18px;accent-color:var(--verde)}
.cobro.si{background:var(--verde-suave);color:var(--verde);border-color:transparent}
details summary{font-size:13px;color:var(--tinta2);cursor:pointer;padding:4px 0}
details .dos{margin-top:8px}
.gps{background:var(--rojo-suave);color:var(--rojo);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--papel);border-top:1px solid var(--linea);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav div{display:flex;width:100%;max-width:760px}
.nav button{flex:1;background:none;border:0;padding:10px 2px 12px;font-size:12px;font-weight:600;color:var(--tinta2);cursor:pointer;display:grid;gap:2px;justify-items:center;position:relative}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--rojo)}
.nav .globo{position:absolute;top:4px;left:calc(50% + 6px);background:var(--rojo);color:#fff;border-radius:99px;font-size:11px;min-width:18px;padding:0 5px;line-height:18px}
@media (min-width:900px){
  .marco{max-width:1280px;padding:28px 40px 60px}
  body:has(.nav:not([hidden])) .marco{margin-left:228px;max-width:none}
  .cab h1{font-size:26px}
  #entrada,#espera-mail{max-width:460px;margin:48px auto;padding:28px}
  .nav{top:0;bottom:0;right:auto;width:228px;border-top:0;border-right:1px solid var(--linea);padding:28px 14px;justify-content:flex-start;align-items:flex-start}
  .nav div{flex-direction:column;gap:4px}
  .nav button{flex:none;display:flex;align-items:center;justify-content:flex-start;gap:14px;font-size:15px;padding:13px 14px;border-radius:12px;width:100%}
  .nav button:hover{background:var(--pan);color:var(--tinta)}
  .nav button[aria-current="page"]{background:var(--rojo-suave)}
  .nav .globo{position:static;margin-left:auto}
  #lista-pedidos > .tarjeta{margin:0;padding:22px}
  #lista-pedidos > .vacio{grid-column:1/-1}
  .chips{flex-wrap:wrap;overflow:visible;margin:0 0 18px;padding:0}
  .chips button{font-size:15px;padding:10px 18px}
  .chips button:hover{border-color:var(--tinta)}
  .boton{transition:filter .15s}.boton:hover:not(:disabled){filter:brightness(1.08)}
}
.ped-cab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ped-cab h2{font-size:26px}
.ped-buscar{flex:1 1 220px;max-width:360px;border:1px solid var(--linea);background:var(--papel);border-radius:12px;padding:11px 12px;font:inherit;color:inherit}
.estados{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 8px;padding:0 16px 4px}
.estados::-webkit-scrollbar,.ped-dias::-webkit-scrollbar{display:none}
.est-b{flex:none;border:1px solid var(--linea);background:var(--papel);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600;color:var(--tinta);cursor:pointer;white-space:nowrap}
.est-b b{display:inline-block;min-width:22px;margin-left:4px;padding:1px 7px;border-radius:99px;background:var(--pan);font-size:12px;text-align:center}
.est-b[aria-pressed="true"]{background:var(--tinta);color:var(--pan);border-color:var(--tinta)}
.est-b[aria-pressed="true"] b{background:rgba(255,255,255,.18);color:inherit}
.est-b.urgente b{background:var(--ambar);color:#fff}
.ped-dias{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 10px;padding:0 16px 4px}
.ped-dias button{flex:none;border:0;background:none;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--tinta2);cursor:pointer;white-space:nowrap}
.ped-dias button[aria-pressed="true"]{background:var(--rojo-suave);color:var(--rojo)}
.ped-resumen{margin:0 0 6px}
.ped-dia{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:17px;margin:18px 0 8px}
.ped-dia small{font:500 13px var(--texto);color:var(--tinta2)}
.ped{background:var(--papel);border:1px solid var(--linea);border-radius:14px;margin-bottom:8px;overflow:hidden}
.ped.abierto{border-color:var(--tinta)}
.ped.apagado .ped-fila{opacity:.65}
.ped-fila{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"quien plata" "n estado";gap:4px 10px;align-items:center;width:100%;border:0;background:none;padding:12px 14px;text-align:left;cursor:pointer;color:inherit}
.ped-n{grid-area:n;font-size:12px;color:var(--tinta2);font-weight:600}
.ped-quien{grid-area:quien;min-width:0}.ped-quien b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ped-quien small{font-size:12px;color:var(--tinta2)}
.ped-plata{grid-area:plata;text-align:right}.ped-plata b{display:block;font-variant-numeric:tabular-nums}
.ped-plata small{font-size:11px;font-weight:700}.ped-plata small.si{color:var(--verde)}.ped-plata small.no{color:var(--ambar)}
.ped-fila .estado{grid-area:estado;justify-self:end}
.ped-flecha{display:none}
.ped-detalle{border-top:1px solid var(--linea)}
.ped-detalle .tarjeta{border:0;border-radius:0;margin:0;background:none}
.ped-detalle .pedido-cab{display:none}
@media (min-width:900px){
  .ped-cab h2{font-size:32px}
  .estados,.ped-dias{flex-wrap:wrap;overflow:visible;margin-left:0;margin-right:0;padding-left:0;padding-right:0}
  .ped-fila{grid-template-columns:80px minmax(0,1fr) 150px 170px 20px;grid-template-areas:"n quien plata estado flecha";padding:14px 18px}
  .ped-n{font-size:14px}
  .ped-fila .estado{justify-self:start}
  .ped-flecha{display:block;grid-area:flecha;color:var(--tinta2);transition:transform .15s}
  .ped.abierto .ped-flecha{transform:rotate(180deg)}
  .ped-fila:hover{background:var(--pan)}
  .ped-detalle .tarjeta{padding:4px 18px 18px}
  .ped-detalle .acciones{max-width:560px}
}
.vacio{text-align:center;color:var(--tinta2);padding:28px 8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="marco">
  <header class="cab">
    <img src="../img/fausto.png" alt="">
    <h1 id="titulo">Los Miga de Fausto</h1>
    <a class="a-tienda" href="../">Ir a la tienda</a>
    <button type="button" id="salir" hidden>Salir</button>
  </header>

  <form class="tarjeta" id="entrada" hidden novalidate>

      <div class="campo"><label for="apellido">Apellido</label><input id="apellido" autocomplete="family-name" autocapitalize="words"></div></div>
    <div class="campo" id="campo-cel" hidden><label for="cel">Tu celular</label><input id="cel" type="tel" inputmode="tel" autocomplete="tel" placeholder="Ej: 11 5555 5555"></div>

      <div class="con-ver"><input id="clave" type="password" autocomplete="current-password"><button type="button" class="ver" data-verclave="clave">Ver</button></div>

        <div class="fuerza"><i id="fuerza-barra"></i></div>

          <li id="req-largo">8 caracteres o más</li>
          <li id="req-letra">Al menos una letra</li>
          <li id="req-numero">Al menos un número</li>
        </ul>
      </div></div>
    <div class="campo" id="campo-clave2" hidden><label for="clave2">Repetí la contraseña</label>
      <div class="con-ver"><input id="clave2" type="password" autocomplete="new-password"><button type="button" class="ver" data-verclave="clave2">Ver</button></div>
      <small class="chica" id="coincide"></small></div>
    <p class="error" id="entrada-error" hidden></p>
    <p class="aviso-ok" id="entrada-ok" hidden></p>
    <button class="boton" type="submit" id="entrada-b">Entrar</button>
    <button class="boton suave" type="button" id="reenviar" style="margin-top:8px" hidden>Mandarme de nuevo el mail de confirmación</button>
    <button class="enlace" type="button" id="olvide">Olvidé mi contraseña</button>
    <button class="boton suave" type="button" id="modo" style="margin-top:8px">Es mi primera vez: crear mi cuenta</button>
  </form>

  <div class="tarjeta" id="espera-mail" hidden><h2>Un segundo…</h2><p class="chica">Estamos entrando a tu cuenta.</p></div>

  <main id="adentro" hidden>
    <div class="gps" id="gps" hidden></div>
    <p class="error" id="falla" hidden></p>
    <section id="v-inicio"></section>
    <section id="v-pedidos" hidden>
      <div class="ped-cab"><h2>Pedidos</h2><input class="ped-buscar" id="ped-buscar" type="search" placeholder="Buscar por nombre, celular o N°" aria-label="Buscar pedido"></div>
      <div class="estados" id="ped-estados"></div>
      <div class="ped-dias" id="ped-dias"></div>
      <p class="chica ped-resumen" id="ped-resumen"></p>
      <div id="lista-pedidos"></div>
    </section>
    <section id="v-extra" hidden></section>
  </main>
</div>

<nav class="nav" id="nav" hidden><div>

  <button type="button" data-ir="pedidos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Pedidos<span class="globo" id="globo" hidden></span></button>
  <button type="button" data-ir="productos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.5 12a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2zM9 7V5a3 3 0 0 1 6 0v2"/></svg>Productos</button>
  <button type="button" data-ir="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/></svg>Stock</button>

</div></nav>

<script>
(function(){
  var M=window.MIGA,$=M.$,esc=M.esc,plata=M.plata;
  var ins=[],porId={},formula={},receta={},compras=[],prods=[];
  var est={prod:null,tab:"insumos",periodo:30,demo:false,form:null,insumo:null,medida:"v",rk:"general",rkPor:"v"},forzar=true;
  var CAT={clasicos:"Clásicos",especiales:"Especiales",combos:"Combos",picadas:"Picadas",bebidas:"Bebidas"},CATS=["clasicos","especiales","combos","picadas","bebidas"];
  var DSEM=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  var nro=function(v,d){return (+v).toLocaleString("es-AR",{maximumFractionDigits:d==null?0:d,minimumFractionDigits:0})};
  var pct=function(v){return v==null||!isFinite(v)?"—":Math.round(v*100)+"%"};
  function cant(q,u){q=+q;return u==="g"?(Math.abs(q)>=1000?nro(q/1000,2)+" kg":nro(q,0)+" g"):u==="ml"?(Math.abs(q)>=1000?nro(q/1000,2)+" L":nro(q,0)+" ml"):nro(q,1)+" un"}
  function porUnidad(i){var c=costoUnit(i);if(c==null)return "—";return i.unidad==="un"?plata(c)+" c/u":plata(c*1000)+(i.unidad==="g"?" el kg":" el litro")}

  M.cargar=function(){return Promise.all([M.llamar("insumos?select=*&order=nombre"),M.llamar("insumo_formula?select=*"),M.llamar("producto_receta?select=*"),
      M.llamar("compras?select=*&order=fecha.desc,id.desc&limit=80"),M.llamar("producciones?select=*&order=fecha.desc,id.desc&limit=80")]).then(function(r){
    ins=r[0];porId={};ins.forEach(function(i){porId[i.id]=i});formula={};r[1].forEach(function(f){(formula[f.preparacion_id]=formula[f.preparacion_id]||[]).push(f)});
    receta={};r[2].forEach(function(x){(receta[x.producto_id]=receta[x.producto_id]||[]).push(x)});compras=r[3];prods=r[4]})};

  /* ---------- cuentas ---------- */
  function costoUnit(i,prof){if(!i)return null;prof=prof||0;
    if(!i.es_preparacion)return i.precio_compra>0&&i.cantidad_compra>0?i.precio_compra/i.cantidad_compra:null;
    var f=formula[i.id]||[];if(!f.length||!(i.rendimiento>0)||prof>4)return null;var t=0;
    for(var k=0;k<f.length;k++){var c=costoUnit(porId[f[k].insumo_id],prof+1);if(c==null)return null;t+=c*f[k].cantidad}return t/i.rendimiento}
  function productos(){var p=M.datos().productos;return Object.keys(p).map(function(k){return p[k]}).sort(function(a,b){return a.orden-b.orden})}
  function costoProd(p){if(!p)return null;
    if(p.tipo==="combo"){var c=M.datos().contenido[p.id]||[];if(!c.length)return null;var t=0;
      for(var k=0;k<c.length;k++){var g=costoProd(M.datos().productos[c[k].gusto_id]);if(g==null)return null;t+=g*c[k].cantidad}return t}
    var r=receta[p.id]||[];if(!r.length)return null;var s=0;
    for(var j=0;j<r.length;j++){var u=costoUnit(porId[r[j].insumo_id]);if(u==null)return null;s+=u*r[j].cantidad}return s/(p.rinde||1)}
  function crudo(id,q,acc,prof){var i=porId[id];if(!i||(prof||0)>4)return;
    if(i.es_preparacion)(formula[i.id]||[]).forEach(function(f){crudo(f.insumo_id,f.cantidad*q/(i.rendimiento||1),acc,(prof||0)+1)});else acc[id]=(acc[id]||0)+q}
  function necesita(p){var a={};(receta[p.id]||[]).forEach(function(x){crudo(x.insumo_id,+x.cantidad,a)});return a}
  function alcanza(p){var n=necesita(p),min=Infinity,lim=null;Object.keys(n).forEach(function(k){var s=Math.max(0,+porId[k].stock)/n[k];if(s<min){min=s;lim=porId[k]}});
    return {armadas:isFinite(min)?Math.floor(min):0,limite:lim}}
  function margen(p){var c=costoProd(p);return c==null||!p.precio?null:(p.precio-c)/p.precio}
  function pillMargen(m){return m==null?'<span class="pill gris">sin costo</span>':'<span class="pill '+(m>=.55?"bien":m>=.4?"medio":"mal")+'">'+pct(m)+'</span>'}

  /* ---------- ventas ---------- */
  function diaAR(iso){return new Date(iso).toLocaleDateString("en-CA",{timeZone:"America/Argentina/Buenos_Aires"})}
  var DEMO=null;
  function ejemplo(){if(DEMO)return DEMO;var s=7,al=function(){s=(s*16807)%2147483647;return s/2147483647},ps=productos().filter(function(p){return p.activo}),H=M.hoy(),l=[],n=500;
    var nombres=["Carla","Juan","Marta","Nico","Sofía","Pablo","Lucía","Diego","Flor","Tomás","Vale","Seba"],peso={jq:9,jqt:5,jqh:4,po:4,be:2,te:3,vt:3,c12:7,c12s:5,c12e:3,c24:2,c6:3,pic4:2,pic2:1,heineken:3,corona:2,gas:4,"six-heineken":2,previa:2};
    for(var d=59;d>=0;d--){var f=M.masDias(H,-d),dw=new Date(f+"T12:00:00").getDay(),cuantos=Math.floor(al()*(dw===5||dw===6?5:dw===4?3:1.6));
      for(var k=0;k<cuantos;k++){var r=[],tot=0,sand=0,veces=1+Math.floor(al()*3);
        for(var v=0;v<veces;v++){var sum=0;ps.forEach(function(p){sum+=peso[p.id]||1});var x=al()*sum,e=ps[0];for(var q=0;q<ps.length;q++){x-=peso[ps[q].id]||1;if(x<=0){e=ps[q];break}}
          var c=e.tipo==="gusto"?6*(1+Math.floor(al()*4)):1+Math.floor(al()*2);r.push({id:n*10+v,producto_id:e.id,nombre:e.nombre,cantidad:c,precio:e.precio,sandwiches:c*e.sandwiches});tot+=c*e.precio;sand+=c*e.sandwiches}
        var nom=nombres[Math.floor(al()*nombres.length)];
        var hh=[9,10,11,12,13,14,17,18,19,19,20,20,21,21,22,23][Math.floor(al()*16)],mm=Math.floor(al()*60);
        l.push({id:"demo"+n,numero:n++,creado:f+"T"+(hh<10?"0":"")+hh+":"+(mm<10?"0":"")+mm+":00-03:00",fecha_entrega:M.masDias(f,1+Math.floor(al()*3)),nombre:nom,telefono:"11 5555 "+(1000+nombres.indexOf(nom)),entrega:al()<.6?"retiro":"envio",
          pago:al()<.65?"transferencia":"efectivo",estado:d>2?"entregado":"confirmado",cobrado:d>2||al()<.5,sandwiches:sand,bruto:tot,descuento:0,total:tot,pedido_renglones:r})}}
    return DEMO=l}
  function ventas(){return (est.demo?ejemplo():M.datos().pedidos).filter(function(p){return p.estado!=="cancelado"})}
  function enRango(l,desde,hasta){return l.filter(function(p){var d=diaAR(p.creado);return d>=desde&&d<=hasta})}
  function resumen(l){var r={total:0,n:l.length,sand:0,costo:0,sinCosto:0,cobrado:0,desc:0};
    l.forEach(function(p){r.total+=p.total;r.sand+=p.sandwiches;r.desc+=p.descuento||0;if(p.cobrado)r.cobrado+=p.total;
      p.pedido_renglones.forEach(function(x){var c=costoProd(M.datos().productos[x.producto_id]);if(c==null)r.sinCosto+=x.cantidad*x.precio;else r.costo+=c*x.cantidad})});
    r.ticket=r.n?r.total/r.n:0;r.ganancia=r.total-r.sinCosto-r.costo;r.margen=r.total-r.sinCosto>0?r.ganancia/(r.total-r.sinCosto):null;return r}

  /* ---------- piezas ---------- */
  function kpi(t,v,sub,cls,subcls){return '<div class="kpi'+(cls?" "+cls:"")+'"><span>'+t+'</span><b>'+v+'</b>'+(sub?'<small'+(subcls?' class="'+subcls+'"':"")+'>'+sub+'</small>':"")+'</div>'}
  function delta(a,b){if(!b)return ["sin datos del período anterior",""];var d=(a-b)/b;return [(d>=0?"▲ ":"▼ ")+Math.abs(Math.round(d*100))+"% contra el período anterior",d>=0?"sube":"baja"]}
  function barrasH(items,fmt,vacio){if(!items.length)return '<p class="chica">'+(vacio||"Todavía no hay datos.")+'</p>';var max=Math.max.apply(null,items.map(function(i){return i.v}))||1;
    return '<div class="barras-h">'+items.map(function(i){return '<div class="bh"><span class="n" title="'+esc(i.n)+'">'+esc(i.n)+'</span><span class="b"><i style="width:'+Math.max(2,100*i.v/max)+'%"></i></span><span class="v">'+fmt(i.v)+(i.x?'<small>'+i.x+'</small>':"")+'</span></div>'}).join("")+'</div>'}
  function grafDias(serie){var W=720,Hh=200,izq=44,ab=22,arr=10,max=Math.max.apply(null,serie.map(function(s){return s.v}))||1;
    var pot=Math.pow(10,Math.floor(Math.log10(max))),tope=Math.ceil(max/pot)*pot;if(tope/pot>5)tope=Math.ceil(max/(pot*2))*pot*2;
    var aw=(W-izq)/serie.length,bw=Math.max(3,Math.min(24,aw-2)),h='<svg class="graf" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Ventas por día">';
    for(var g=0;g<=2;g++){var y=arr+(Hh-ab-arr)*(1-g/2);h+='<line class="eje" x1="'+izq+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text x="'+(izq-6)+'" y="'+(y+4)+'" text-anchor="end">'+(g?"$"+nro(tope*g/2/1000,0)+"k":"0")+'</text>'}
    var cada=Math.ceil(serie.length/8);
    serie.forEach(function(s,k){var x=izq+k*aw+(aw-bw)/2,bh=(Hh-ab-arr)*s.v/tope,y=Hh-ab-bh;
      if(s.v>0)h+='<rect class="d" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="'+Math.min(4,bw/2)+'"/>';
      h+='<rect class="z" data-tip="'+esc(M.fechaCorta(s.f)+" · "+plata(s.v)+" · "+s.n+(s.n===1?" pedido":" pedidos"))+'" x="'+(izq+k*aw).toFixed(1)+'" y="0" width="'+aw.toFixed(1)+'" height="'+(Hh-ab)+'"/>';
      if(k%cada===0)h+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(Hh-6)+'" text-anchor="middle">'+s.f.slice(8)+"/"+(+s.f.slice(5,7))+'</text>'});
    return h+'</svg>'}
  function partes(lista){var t=lista.reduce(function(a,b){return a+b.v},0)||1;
    return '<div class="partes">'+lista.map(function(x){return x.v?'<i style="width:'+100*x.v/t+'%;background:'+x.c+'" title="'+esc(x.n)+'"></i>':""}).join("")+'</div><div class="leyenda">'+
      lista.map(function(x){return '<span style="--c:'+x.c+'">'+esc(x.n)+' <b>'+(x.f||pct(x.v/t))+'</b></span>'}).join("")+'</div>'}

  /* =================== INICIO =================== */
  M.vistas.inicio=function(el){var H=M.hoy(),ped=M.datos().pedidos,vivos=ped.filter(function(p){return p.estado!=="cancelado"}),dias=M.datos().dias;
    var nuevos=ped.filter(function(p){return p.estado==="nuevo"}).length,hoyEnt=vivos.filter(function(p){return p.fecha_entrega===H&&p.estado!=="entregado"}).length;
    var mes=enRango(vivos,H.slice(0,8)+"01",H),rm=resumen(mes),porCobrar=vivos.filter(function(p){return !p.cobrado}).reduce(function(a,p){return a+p.total},0);
    var h='<div class="g-titulo"><div><h2>Hola 👋</h2><p class="chica">'+new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})+'</p></div></div><div class="kpis">'+
      kpi("Para confirmar",nuevos,nuevos?"Tocá para verlos":"Estás al día",nuevos?"alerta":"")+kpi("Entregas de hoy",hoyEnt,hoyEnt?"pendientes":"nada pendiente")+
      kpi("Ventas del mes",plata(rm.total),rm.n+(rm.n===1?" pedido":" pedidos"))+kpi("Ganancia estimada",plata(rm.ganancia),rm.margen==null?"cargá costos para verla":"margen "+pct(rm.margen),"k-deja")+
      kpi("Falta cobrar",plata(porCobrar),"de pedidos sin marcar cobrado")+'</div>';
    var serie=[];for(var d=13;d>=0;d--){var f=M.masDias(H,-d),l=enRango(vivos,f,f);serie.push({f:f,v:l.reduce(function(a,p){return a+p.total},0),n:l.length})}
    h+='<div class="g-grid tres"><div class="tarjeta"><h2>Ventas de los últimos 14 días</h2>'+(serie.some(function(s){return s.v})?grafDias(serie):'<p class="chica">Todavía no entraron pedidos. Cuando entren, vas a ver acá cómo viene la venta día por día.</p>')+'</div>';
    /* alertas */
    var al=[],bajos=ins.filter(function(i){return !i.es_preparacion&&i.activo&&+i.stock_minimo>0&&+i.stock<+i.stock_minimo});
    bajos.slice(0,5).forEach(function(i){al.push('<li><span class="pill mal">Stock bajo</span><span>'+esc(i.nombre)+": quedan "+cant(i.stock,i.unidad)+'</span></li>')});

    h+='<div class="tarjeta"><h2>Para mirar</h2>'+(al.length?'<ul class="lista-alertas">'+al.slice(0,8).join("")+'</ul>':'<p class="chica">Todo en orden: costos cargados, márgenes sanos y stock por encima del mínimo.</p>')+'</div></div>';
    /* próximas entregas con producción y qué falta comprar */
    var prox={};vivos.forEach(function(p){if(p.fecha_entrega>=H&&p.estado!=="entregado")(prox[p.fecha_entrega]=prox[p.fecha_entrega]||[]).push(p)});
    var fechas=Object.keys(prox).sort();
    h+='<div class="g-titulo" style="margin-top:22px"><h2>Próximas entregas</h2></div>';
    if(!fechas.length)h+='<div class="tarjeta"><p class="chica">No hay pedidos para los próximos días.</p></div>';
    var todos=[];fechas.forEach(function(f){todos=todos.concat(prox[f])});
    if(todos.length){var pr=M.produccion(todos),nec={};pr.gustos.forEach(function(g){var p=M.datos().productos[g.id],n=necesita(p||{}),arm=Math.ceil(g.c/((p||{}).rinde||6));Object.keys(n).forEach(function(k){nec[k]=(nec[k]||0)+n[k]*arm})});
      var falta=Object.keys(nec).map(function(k){return {i:porId[k],q:nec[k],f:nec[k]-Math.max(0,+porId[k].stock)}}).filter(function(x){return x.f>0}).sort(function(a,b){return a.i.nombre.localeCompare(b.i.nombre)});
      var hayStock=ins.some(function(i){return +i.stock>0});
      h+='<div class="g-grid dos"><div class="tarjeta ancho"><h2>Lista de compras para todo lo pedido</h2>'+(!Object.keys(nec).length?'<p class="chica">Cargá las recetas para ver qué hace falta comprar.</p>':

    var mejor=serie.slice().sort(function(a,b){return b.v-a.v})[0],cli={};l.forEach(function(p){var kk=String(p.telefono).replace(/\D/g,"")||p.nombre;cli[kk]=cli[kk]||{n:p.nombre,c:0,v:0};cli[kk].c++;cli[kk].v+=p.total});
    var lc=Object.keys(cli).map(function(kk){return cli[kk]}),fiel=lc.slice().sort(function(a,b){return b.c-a.c||b.v-a.v})[0],grande=l.slice().sort(function(a,b){return b.total-a.total})[0];
    var picos=[0,0,0,0];mat.forEach(function(f){f.forEach(function(v,j){picos[j]+=v})});var pico=picos.indexOf(Math.max.apply(null,picos)),repiten=lc.filter(function(c){return c.c>1}).length;
    h+='<div class="tarjeta ancho"><h2>Récords y datos curiosos</h2><div class="records">'+
      [["📅","Mejor día",mejor&&mejor.v?M.fechaCorta(mejor.f):"—",mejor?plata(mejor.v):""],["🧾","Pedido más grande",grande?plata(grande.total):"—",grande?esc(grande.nombre)+" · "+grande.sandwiches+" sándwiches":""],
       ["⭐","Gusto estrella",lg[0]?esc(lg[0].n):"—",lg[0]?nro(lg[0].v)+" sándwiches":""],["⏰","Momento pico",FR[pico],"cuando entran más pedidos"],
       ["❤️","Cliente más fiel",fiel?esc(fiel.n):"—",fiel?fiel.c+(fiel.c===1?" pedido":" pedidos")+" · "+plata(fiel.v):""],["🔁","Clientes que repiten",lc.length?pct(repiten/lc.length):"—",repiten+" de "+lc.length+" clientes"]]
      .map(function(x){return '<div class="record"><span class="record-i">'+x[0]+'</span><small>'+x[1]+'</small><b>'+x[2]+'</b><span>'+x[3]+'</span></div>'}).join("")+'</div></div>';
    /* mejores clientes */
    h+='<div class="tarjeta ancho"><h2>Mejores clientes</h2><div class="clientes">'+lc.sort(function(a,b){return b.v-a.v}).slice(0,8).map(function(c,i){var ini2=c.n.split(" ").map(function(w){return w[0]}).join("").slice(0,2).toUpperCase();
      return '<div class="cliente"><span class="avatar">'+esc(ini2)+'</span><div><b>'+esc(c.n)+'</b><small>'+c.c+(c.c===1?" pedido":" pedidos")+" · ticket "+plata(c.v/c.c)+'</small></div><span class="cliente-v">'+plata(c.v)+'</span>'+(i===0?'<span class="pill bien">#1</span>':"")+'</div>'}).join("")+'</div></div></div>';
    el.innerHTML=h;
    /* animaciones: solo la primera vez que se abre (o al cambiar período), no en cada refresco */
    var mover=!animar.ya&&!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);animar.ya=true;
    if(mover){el.classList.add("g-anim");void el.offsetWidth;requestAnimationFrame(function(){el.classList.remove("g-anim")});
      el.querySelectorAll("[data-contar]").forEach(function(b){var fin=+b.dataset.contar,tipo=b.dataset.tipo,t0=performance.now();
        (function paso(t){var p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3),v=fin*e;b.textContent=tipo==="plata"?plata(Math.round(v)):tipo==="pct"?pct(v):nro(Math.round(v));if(p<1)requestAnimationFrame(paso)})(t0)})}};

  /* ---------- no pisar lo que se está escribiendo cuando el panel se refresca solo ---------- */
  Object.keys(M.vistas).forEach(function(k){var f=M.vistas[k];M.vistas[k]=function(el){var a=document.activeElement;
    if(!forzar&&a&&el.contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return;forzar=false;f(el)}});
  function pintar(){forzar=true;M.pintar()}
  function recargar(){forzar=true;return M.traer()}
  function fallo(e){forzar=true;alert(e&&e.dicho?e.dicho:"No se pudo guardar. Revisá la conexión y probá de nuevo.")}
  function num(v){var n=parseFloat(String(v).replace(/\./g,"").replace(",","."));return isFinite(n)?n:NaN}
  function numSimple(v){var n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:NaN}

  var caja=$("v-extra");
  caja.addEventListener("click",function(e){var t=e.target,x;
    if((x=t.closest("[data-prodficha]"))){est.prod=x.dataset.prodficha||null;pintar();window.scrollTo(0,0);return}
    if((x=t.closest("[data-stab]"))){est.tab=x.dataset.stab;pintar();return}
    if((x=t.closest("[data-form]"))){est.form=x.dataset.form||null;est.insumo=null;pintar();return}
    if((x=t.closest("[data-compra]"))){est.form="compra";est.insumo=x.dataset.compra;pintar();window.scrollTo(0,0);return}
    if((x=t.closest("[data-editar]"))){est.form="editar";est.insumo=x.dataset.editar;pintar();window.scrollTo(0,0);return}
    if((x=t.closest("[data-periodo]"))){est.periodo=x.dataset.periodo==="todo"?"todo":+x.dataset.periodo;pintar();return}
    if((x=t.closest("[data-demo]"))){est.demo=x.dataset.demo==="1";pintar();return}
    if((x=t.closest("[data-medida]"))){est.medida=x.dataset.medida;pintar();return}
    if((x=t.closest("[data-rk]"))){est.rk=x.dataset.rk;pintar();return}
    if((x=t.closest("[data-rkpor]"))){est.rkPor=x.dataset.rkpor;pintar();return}
    if((x=t.closest("[data-sugerido]"))){$("g-precio").value=x.dataset.sugerido;$("g-precio").focus();return}
    if((x=t.closest("[data-quitar]"))){if(!confirm("¿Quitar este ingrediente?"))return;
      var c=x.dataset.quitar==="receta"?"producto_receta?producto_id=eq."+encodeURIComponent(x.dataset.dueno)+"&insumo_id=eq."+x.dataset.ins:"insumo_formula?preparacion_id=eq."+x.dataset.dueno+"&insumo_id=eq."+x.dataset.ins;
      M.llamar(c,{metodo:"DELETE"}).then(recargar,fallo)}});
  caja.addEventListener("pointermove",function(e){if(e.target.closest&&e.target.closest(".graf-area")){moverCruz(e);return}
    var g=caja.querySelector(".graf-area");if(g){var l=g.querySelector(".cruz"),pp=g.querySelector(".cruz-p");if(l)l.style.display="none";if(pp)pp.style.display="none"}});
  caja.addEventListener("mousemove",function(e){if(e.target.closest&&e.target.closest(".graf-area"))return;var z=e.target.closest&&e.target.closest("[data-tip]"),tip=$("g-tip");
    if(!z){if(tip)tip.hidden=true;return}if(!tip){tip=document.createElement("div");tip.id="g-tip";document.body.appendChild(tip)}
    tip.hidden=false;tip.textContent=z.dataset.tip;tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px"});
  caja.addEventListener("mouseleave",function(){var tip=$("g-tip");if(tip)tip.hidden=true});
  caja.addEventListener("change",function(e){var t=e.target;
    if(t.dataset.activo){M.llamar("productos?id=eq."+encodeURIComponent(t.dataset.activo),{metodo:"PATCH",cuerpo:{activo:t.checked,actualizado:new Date().toISOString()}}).then(recargar,fallo);return}
    if(t.dataset.comp){var q=numSimple(t.value);if(!(q>0)){alert("Poné una cantidad mayor a cero.");return}
      var c=t.dataset.comp==="receta"?"producto_receta?producto_id=eq."+encodeURIComponent(t.dataset.dueno)+"&insumo_id=eq."+t.dataset.ins:"insumo_formula?preparacion_id=eq."+t.dataset.dueno+"&insumo_id=eq."+t.dataset.ins;
      M.llamar(c,{metodo:"PATCH",cuerpo:{cantidad:q}}).then(recargar,fallo)}});
  caja.addEventListener("submit",function(e){e.preventDefault();var f=e.target,d=new FormData(f),b=f.querySelector('[type="submit"]');
    var hecho=function(){est.form=null;est.insumo=null;return recargar()},mal=function(er){if(b)b.disabled=false;fallo(er)};
    if(f.dataset.precio){var p=Math.round(num(d.get("precio")));if(!(p>0)){alert("Poné un precio válido.");return}if(b)b.disabled=true;
      M.llamar("productos?id=eq."+encodeURIComponent(f.dataset.precio),{metodo:"PATCH",cuerpo:{precio:p,actualizado:new Date().toISOString()}}).then(recargar,mal);return}
    if(f.dataset.rinde){var r=Math.round(numSimple(d.get("rinde")));if(!(r>0)){alert("Poné cuántos sándwiches salen.");return}
      M.llamar("productos?id=eq."+encodeURIComponent(f.dataset.rinde),{metodo:"PATCH",cuerpo:{rinde:r}}).then(recargar,mal);return}
    if(f.dataset.agrega){var q=numSimple(d.get("q")),i=d.get("ins");if(!i||!(q>0)){alert("Elegí el ingrediente y la cantidad.");return}
      var cuerpo=f.dataset.agrega==="receta"?{producto_id:f.dataset.dueno,insumo_id:+i,cantidad:q}:{preparacion_id:+f.dataset.dueno,insumo_id:+i,cantidad:q};
      M.llamar(f.dataset.agrega==="receta"?"producto_receta":"insumo_formula",{cuerpo:cuerpo}).then(recargar,mal);return}
    if(f.dataset.guardar==="compra"){var qc=numSimple(d.get("q")),tc=numSimple(d.get("t"));if(!d.get("ins")||!(qc>0)||!(tc>=0)){alert("Completá qué compraste, la cantidad y el total.");return}if(b)b.disabled=true;
      M.llamar("rpc/registrar_compra",{cuerpo:{p_insumo:+d.get("ins"),p_cantidad:qc,p_total:tc,p_fecha:d.get("f")||null,p_nota:d.get("n")||null}}).then(hecho,mal);return}
    if(f.dataset.guardar==="produccion"){var a=numSimple(d.get("a"));if(!d.get("prod")||!(a>0)){alert("Elegí qué hiciste y cuántas armadas.");return}if(b)b.disabled=true;
      M.llamar("rpc/registrar_produccion",{cuerpo:{p_producto:d.get("prod"),p_armadas:a,p_fecha:d.get("f")||null,p_nota:null}}).then(hecho,mal);return}
    if(f.dataset.guardar==="insumo"){var n=String(d.get("nombre")||"").trim();if(n.length<2){alert("Falta el nombre.");return}
      var o={nombre:n,unidad:d.get("unidad"),stock_minimo:numSimple(d.get("min"))||0,actualizado:new Date().toISOString()};if(d.has("stock"))o.stock=numSimple(d.get("stock"))||0;
      if(d.has("precio")){o.precio_compra=numSimple(d.get("precio"))||null;o.cantidad_compra=numSimple(d.get("cantc"))||null}
      if(d.has("rend"))o.rendimiento=numSimple(d.get("rend"))||null;
      if(b)b.disabled=true;
      if(f.dataset.id)M.llamar("insumos?id=eq."+f.dataset.id,{metodo:"PATCH",cuerpo:o}).then(hecho,mal);
      else{o.es_preparacion=!!d.get("prep");M.llamar("insumos",{cuerpo:o}).then(function(r){var nuevo=r&&r[0];
        /* recién creado: si es algo que se compra, abre directo "Anotar compra" con ese insumo */
        if(nuevo&&!nuevo.es_preparacion){est.form="compra";est.insumo=nuevo.id;return recargar()}return hecho()},mal)}}});
})();
</script>
